version: 1
defaults:
  errors: [400, 401, 403, 404, 409, 412, 429, 500, 502, 503, 504]
operations:
  Live:
    tag: 健康检查
    summary: 存活探针
    description: 仅证明 Gateway 进程存活，不检查业务依赖。
    security: none
    success_status: 200
    errors: []
  Ready:
    tag: 健康检查
    summary: 就绪探针
    description: 返回 Gateway 是否已经可以接收公网请求。
    security: none
    success_status: 200
    errors: [503]
  Register:
    tag: 身份与会话
    summary: 注册用户
    description: 创建一个新的用户账户并返回初始 access token。
    security: none
    success_status: 201
    errors: [400, 409, 429, 500, 502, 503]
  Login:
    tag: 身份与会话
    summary: 用户登录
    description: 使用用户名或邮箱和密码创建会话。
    security: none
    success_status: 200
    errors: [400, 401, 423, 429, 500, 502, 503]
  RefreshSession:
    tag: 身份与会话
    summary: 刷新会话
    description: 轮换 refresh token 并返回新的会话 token。
    security: none
    success_status: 200
    errors: [400, 401, 409, 429, 500, 502, 503]
  Logout:
    tag: 身份与会话
    summary: 注销当前会话
    description: 撤销当前 access token 对应的会话。
    security: bearer
    success_status: 200
    errors: [401, 404, 500, 502, 503, 504]
  ListSessions:
    tag: 身份与会话
    summary: 列出会话
    description: 返回当前用户的活动会话列表。
    security: bearer
    success_status: 200
    errors: [401, 500, 502, 503, 504]
  RevokeSession:
    tag: 身份与会话
    summary: 撤销指定会话
    description: 撤销当前用户指定的会话。
    security: bearer
    success_status: 200
    errors: [400, 401, 404, 500, 502, 503, 504]
  RevokeAllSessions:
    tag: 身份与会话
    summary: 撤销全部会话
    description: 撤销当前用户除当前请求外的全部会话。
    security: bearer
    success_status: 200
    errors: [401, 500, 502, 503, 504]
  RequestEmailVerification:
    tag: 身份与会话
    summary: 请求邮箱验证
    description: 为当前登录用户发送一次性验证邮件。未过期令牌窗口内最多重发一次。
    security: bearer
    success_status: 200
    errors: [401, 429, 500, 502, 503, 504]
  GetEmailVerificationStatus:
    tag: 身份与会话
    summary: 获取邮箱验证状态
    description: 返回当前登录用户的邮箱验证状态，包含过期时间和可重试间隔。
    security: bearer
    success_status: 200
    errors: [401, 500, 502, 503, 504]
  VerifyEmail:
    tag: 身份与会话
    summary: 验证邮箱
    description: 使用邮件中的一次性 token 验证邮箱地址。
    security: none
    success_status: 200
    errors: [400, 404, 409, 429, 500, 502, 503, 504]
  RequestPasswordReset:
    tag: 身份与会话
    summary: 请求密码重置
    description: 为用户创建密码重置流程并发送邮件。
    security: none
    success_status: 200
    errors: [400, 429, 500, 502, 503, 504]
  ResetPassword:
    tag: 身份与会话
    summary: 重置密码
    description: 使用一次性 token 设置新密码。
    security: none
    success_status: 200
    errors: [400, 404, 409, 429, 500, 502, 503, 504]
  DeactivateAccount:
    tag: 身份与会话
    summary: 停用账户
    description: 使用当前密码停用当前用户账户并撤销其会话。
    security: bearer
    success_status: 200
    errors: [400, 401, 403, 409, 429, 500, 502, 503, 504]
  CurrentUser:
    tag: 身份与会话
    summary: 获取当前用户
    description: 返回当前 access token 对应的最新用户状态。
    security: bearer
    success_status: 200
    errors: [401, 500, 502, 503, 504]
  ListPublishedDocuments:
    tag: 公开内容
    summary: 列出公开文档
    description: 按游标分页列出当前可见的已发布文档。文档 access 为 none、viewer、editor 或 owner；匿名或无成员关系时为 none，有效 token 可提供访问上下文。
    security: optional
    success_status: 200
    errors: [400, 401, 403, 429, 500, 502, 503, 504]
  GetPublishedDocument:
    tag: 公开内容
    summary: 获取公开文档
    description: 根据 slug 获取已发布文档及其 rich-text 内容和附件。
    security: optional
    success_status: 200
    response_headers: [ETag, X-Request-ID, X-Trace-ID]
    errors: [400, 401, 403, 404, 429, 500, 502, 503, 504]
  GetSiteProfile:
    tag: 公开内容
    summary: 获取站点资料
    description: 返回站点标题、标语和首页展示配置。
    security: none
    success_status: 200
    errors: [500, 502, 503, 504]
  GetConfiguration:
    tag: 管理配置
    summary: 读取配置
    description: 读取指定 namespace 的当前业务配置；敏感值只以脱敏形式返回。
    security: admin
    success_status: 200
    response_headers: [ETag, X-Request-ID, X-Trace-ID]
    errors: [400, 401, 403, 404, 409, 412, 500, 502, 503, 504]
  PutConfiguration:
    tag: 管理配置
    summary: 写入配置
    description: 使用 If-Match 和 Idempotency-Key 以乐观并发方式写入 namespace 配置。
    security: admin
    success_status: 200
    response_headers: [ETag, X-Request-ID, X-Trace-ID]
    errors: [400, 401, 403, 409, 412, 429, 500, 502, 503, 504]
  GetConfigurationDelivery:
    tag: 管理配置
    summary: 查询配置投递
    description: 查询指定配置修订的可靠投递状态。
    security: admin
    success_status: 200
    errors: [400, 401, 403, 404, 500, 502, 503, 504]
  GetAttachmentContent:
    tag: 附件
    summary: 获取附件下载地址
    description: 校验附件可下载状态后返回短期预签名 URL 的 303 重定向；不代理对象正文。
    security: optional
    success_status: 303
    response_headers: [Cache-Control, Location, X-Request-ID, X-Trace-ID]
    errors: [400, 401, 403, 404, 410, 429, 500, 502, 503, 504]
  ListMediaAttachments:
    tag: 附件
    summary: 列出媒体附件
    description: 列出当前用户拥有的通用附件并按游标分页。
    security: bearer
    success_status: 200
    errors: [400, 401, 403, 429, 500, 502, 503, 504]
  CreateMediaAttachment:
    tag: 附件
    summary: 创建媒体附件上传
    description: 创建通用附件 multipart 上传并返回各分片预签名地址。
    security: bearer
    success_status: 201
    response_headers: [Location, X-Request-ID, X-Trace-ID]
    errors: [400, 401, 403, 409, 429, 500, 502, 503, 504]
  GetMediaAttachment:
    tag: 附件
    summary: 获取媒体附件
    description: 获取当前用户可见的通用附件元数据。
    security: bearer
    success_status: 200
    errors: [400, 401, 403, 404, 429, 500, 502, 503, 504]
  CompleteMediaAttachment:
    tag: 附件
    summary: 完成媒体附件上传
    description: 提交所有分片的 ETag 并完成 multipart 上传。
    security: bearer
    success_status: 200
    errors: [400, 401, 403, 404, 409, 429, 500, 502, 503, 504]
  DeleteMediaAttachment:
    tag: 附件
    summary: 删除媒体附件
    description: 将通用附件移入回收状态。
    security: bearer
    success_status: 204
    errors: [400, 401, 403, 404, 409, 429, 500, 502, 503, 504]
  RestoreMediaAttachment:
    tag: 附件
    summary: 恢复媒体附件
    description: 从回收状态恢复通用附件。
    security: bearer
    success_status: 200
    errors: [400, 401, 403, 404, 409, 429, 500, 502, 503, 504]
  ListDocuments:
    tag: Studio 文档
    summary: 列出工作区文档
    description: 按访问级别、发布状态和游标分页列出当前用户可管理的文档。
    security: bearer
    success_status: 200
    errors: [400, 401, 403, 429, 500, 502, 503, 504]
  ListFolders:
    tag: Studio 文件夹
    summary: 列出文件夹
    description: 列出指定父文件夹下的工作区文件夹。
    security: bearer
    success_status: 200
    errors: [400, 401, 403, 429, 500, 502, 503, 504]
  CreateFolder:
    tag: Studio 文件夹
    summary: 创建文件夹
    description: 在工作区中创建文件夹，可使用 Idempotency-Key 保证重试安全。
    security: bearer
    success_status: 201
    response_headers: [Location, X-Request-ID, X-Trace-ID]
    errors: [400, 401, 403, 409, 429, 500, 502, 503, 504]
  UpdateFolder:
    tag: Studio 文件夹
    summary: 更新文件夹
    description: 使用强 If-Match 更新文件夹名称或父级。
    security: bearer
    success_status: 200
    errors: [400, 401, 403, 404, 409, 412, 429, 500, 502, 503, 504]
  DeleteFolder:
    tag: Studio 文件夹
    summary: 删除文件夹
    description: 使用强 If-Match 删除空文件夹。
    security: bearer
    success_status: 204
    errors: [400, 401, 403, 404, 409, 412, 429, 500, 502, 503, 504]
  CreateDocument:
    tag: Studio 文档
    summary: 创建文档
    description: 创建文档元数据并返回工作区文档。
    security: bearer
    success_status: 201
    response_headers: [ETag, Location, X-Request-ID, X-Trace-ID]
    errors: [400, 401, 403, 409, 429, 500, 502, 503, 504]
  GetDocument:
    tag: Studio 文档
    summary: 获取工作区文档
    description: 获取文档当前元数据和访问级别。
    security: bearer
    success_status: 200
    response_headers: [ETag, X-Request-ID, X-Trace-ID]
    errors: [400, 401, 403, 404, 429, 500, 502, 503, 504]
  CreateCollaborationSession:
    tag: 实时协作
    summary: 创建协作会话
    description: 通过 Knowledge 权限复核后创建短期、单次使用的 WebSocket ticket。
    security: bearer
    success_status: 201
    errors: [400, 401, 403, 404, 429, 500, 502, 503, 504]
  UpdateDocument:
    tag: Studio 文档
    summary: 更新文档元数据
    description: 使用强 If-Match 更新文档标题、摘要、slug、语言、标签或文件夹。
    security: bearer
    success_status: 200
    response_headers: [ETag, X-Request-ID, X-Trace-ID]
    errors: [400, 401, 403, 404, 409, 412, 429, 500, 502, 503, 504]
  DeleteDocument:
    tag: Studio 文档
    summary: 删除文档
    description: 使用强 If-Match 将文档移入回收站。
    security: bearer
    success_status: 204
    errors: [400, 401, 403, 404, 409, 412, 429, 500, 502, 503, 504]
  PublishDocument:
    tag: 发布
    summary: 发布文档
    description: 从当前协作 rich-text state vector 捕获快照并发布文档公开投影。
    security: bearer
    success_status: 202
    required_body: [state_vector]
    response_headers: [ETag, X-Request-ID, X-Trace-ID]
    errors: [400, 401, 403, 404, 409, 412, 429, 500, 502, 503, 504]
  UnpublishDocument:
    tag: 发布
    summary: 取消发布文档
    description: 使用强 If-Match 移除文档的公开发布状态。
    security: bearer
    success_status: 204
    errors: [400, 401, 403, 404, 409, 412, 429, 500, 502, 503, 504]
  ListMembers:
    tag: 成员权限
    summary: 列出文档成员
    description: 返回文档成员及其当前角色和权限修订。
    security: bearer
    success_status: 200
    errors: [400, 401, 403, 404, 429, 500, 502, 503, 504]
  AddMember:
    tag: 成员权限
    summary: 添加文档成员
    description: 按用户名添加 viewer 或 editor 成员。
    security: bearer
    success_status: 201
    response_headers: [ETag, Location, X-Request-ID, X-Trace-ID]
    errors: [400, 401, 403, 404, 409, 429, 500, 502, 503, 504]
  UpdateMember:
    tag: 成员权限
    summary: 更新成员角色
    description: 使用成员权限修订更新成员角色。
    security: bearer
    success_status: 200
    response_headers: [ETag, X-Request-ID, X-Trace-ID]
    errors: [400, 401, 403, 404, 409, 412, 429, 500, 502, 503, 504]
  DeleteMember:
    tag: 成员权限
    summary: 移除文档成员
    description: 使用成员权限修订移除指定成员。
    security: bearer
    success_status: 204
    errors: [400, 401, 403, 404, 409, 412, 429, 500, 502, 503, 504]
  ListDeletedDocuments:
    tag: 回收站
    summary: 列出已删除文档
    description: 按游标分页列出当前用户回收站中的文档。
    security: bearer
    success_status: 200
    errors: [400, 401, 403, 429, 500, 502, 503, 504]
  RestoreDeletedDocument:
    tag: 回收站
    summary: 恢复已删除文档
    description: 从回收站恢复指定文档。
    security: bearer
    success_status: 200
    response_headers: [ETag, X-Request-ID, X-Trace-ID]
    errors: [400, 401, 403, 404, 409, 429, 500, 502, 503, 504]
  PermanentlyDeleteDocument:
    tag: 回收站
    summary: 永久删除文档
    description: 使用强 If-Match、幂等键和 X-Confirm-Permanent-Delete=true 二次确认，立即隐藏并异步清理已删除文档，操作不可恢复。
    security: bearer
    success_status: 202
    response_headers: [X-Request-ID, X-Trace-ID]
    errors: [400, 401, 403, 404, 409, 412, 429, 500, 502, 503, 504]
  ListCommits:
    tag: 文档历史
    summary: 列出文档提交
    description: 按时间倒序返回可查看和恢复的文档历史提交。
    security: bearer
    success_status: 200
    errors: [400, 401, 403, 404, 429, 500, 502, 503, 504]
  CreateCommit:
    tag: 文档历史
    summary: 创建文档提交
    description: 将当前编辑稿保存为一条可审阅、可恢复的历史提交。
    security: bearer
    success_status: 201
    errors: [400, 401, 403, 404, 409, 412, 429, 500, 502, 503, 504]
  GetCommit:
    tag: 文档历史
    summary: 获取文档提交
    description: 获取指定历史提交的正文和元数据。
    security: bearer
    success_status: 200
    errors: [400, 401, 403, 404, 429, 500, 502, 503, 504]
  RenameCommit:
    tag: 文档历史
    summary: 重命名文档提交
    description: 更新历史提交的标题或说明，不改变正文状态。
    security: bearer
    success_status: 200
    errors: [400, 401, 403, 404, 409, 412, 429, 500, 502, 503, 504]
  RestoreCommit:
    tag: 文档历史
    summary: 恢复文档提交
    description: 将历史提交恢复为当前编辑稿，并生成新的恢复提交。
    security: bearer
    success_status: 202
    errors: [400, 401, 403, 404, 409, 412, 429, 500, 502, 503, 504]
  ListHistory:
    tag: 文档历史
    summary: 列出自动历史记录
    description: 按时间倒序返回经语义去重的权威草稿历史。
    security: bearer
    success_status: 200
    errors: [400, 401, 403, 404, 429, 500, 502, 503, 504]
  GetHistory:
    tag: 文档历史
    summary: 获取历史记录
    description: 获取指定历史记录的正文、展示元数据、贡献者和块级差异。
    security: bearer
    success_status: 200
    errors: [400, 401, 403, 404, 429, 500, 502, 503, 504]
