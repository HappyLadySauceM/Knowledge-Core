version: 1
title: Knowledge Core Collaboration WebSocket API
description: >-
  Collaboration 为单个文档提供基于 Yjs 的二进制实时协作通道。连接前必须由
  Gateway 创建短期、单次使用的 session ticket。
subprotocol: knowledge-core-yjs-v1
address: /v1/documents/{document_id}
messages:
  - name: clientFrame
    direction: send
    summary: 客户端协作帧
    description: 客户端发送 y-sync 或 awareness 二进制帧。
  - name: serverFrame
    direction: receive
    summary: 服务端协作帧
    description: 服务端发送初始同步、广播更新或 awareness 二进制帧。
close_codes:
  - code: 4400
    reason: invalid-protocol
    description: 子协议、帧格式或协作更新不合法。
  - code: 4401
    reason: session-expired
    description: session ticket 已过期、已使用或关联会话已失效。
  - code: 4403
    reason: forbidden
    description: 用户没有文档访问权限，或权限在连接期间被撤销。
  - code: 4409
    reason: document-invalidated
    description: 文档已删除、失效或不再允许协作。
