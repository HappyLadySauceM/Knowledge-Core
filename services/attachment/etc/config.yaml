app:
  name: attachment
  environment: development
  version: dev
  startup_timeout: 30s
  shutdown_timeout: 45s
log:
  level: info
  add_source: false
  health_check_requests: false
trace:
  enabled: false
  endpoint: 127.0.0.1:4317
  sample_ratio: 0.1
  insecure: true
  batch_timeout: 5s
  export_timeout: 10s
  tls:
    enabled: false
rpc:
  address: :8884
  service_name: knowledge-core.attachment
  read_write_timeout: 30s
  exit_wait_timeout: 10s
  max_connections: 0
  tls:
    enabled: false
admin_http:
  address: :8085
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 2m
  shutdown_timeout: 15s
  max_request_body_size: 4194304
  tls:
    enabled: false
postgres:
  host: 127.0.0.1
  port: 5432
  user: knowledge_core
  database: knowledge_core
  ssl_mode: disable
  time_zone: UTC
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
  conn_max_idle_time: 30m
  connect_timeout: 5s
  slow_threshold: 200ms
  prepare_stmt: false
  tls:
    enabled: false
auth: {}
object_storage:
  endpoint: 127.0.0.1:9000
  public_endpoint: 127.0.0.1:9000
  region: us-east-1
  bucket: knowledge-core-attachments
  secure: false
  public_secure: false
  auto_create_bucket: true
  upload_ttl: 24h
  download_ttl: 5m
scanner:
  address: 127.0.0.1:3310
  dial_timeout: 3s
  scan_timeout: 20m
  maximum_stream: 1073741824
