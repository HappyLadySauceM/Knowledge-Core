[workspace]
resolver = "3"
members = [
    ".",
    "tools/rust-codegen",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/HappyLadySauce/Knowledge-Core"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[package]
name = "knowledge-core-collaboration"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "knowledge_core_collaboration"
path = "src/lib.rs"

[[bin]]
name = "knowledge-core-collaboration"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
aes-gcm = "=0.10.3"
arc-swap = "=1.9.2"
async-broadcast = "=0.7.2"
async-nats = { version = "=0.50.0", default-features = false, features = ["jetstream", "ring", "server_2_11"] }
async-trait = "=0.1.89"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
base64 = "=0.22.1"
bytes = "=1.12.1"
futures-util = "=0.3.33"
metainfo = { version = "=0.7.14", features = ["task_local"] }
motore = "=0.4.1"
nacos-sdk = { version = "=0.8.0", default-features = false, features = ["auth-by-http", "config", "tls"] }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["trace", "grpc-tonic", "tls-ring", "tls-webpki-roots"] }
opentelemetry_sdk = { version = "=0.32.0", default-features = false, features = ["trace", "rt-tokio"] }
pilota = "=0.13.1"
prometheus = { version = "=0.14.0", default-features = false }
rand = { version = "=0.9.5", default-features = false, features = ["os_rng"] }
redis = { version = "=1.5.0", default-features = false, features = ["aio", "connection-manager", "tokio-rustls-comp"] }
rustls = "=0.23.37"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["derive", "json", "postgres", "runtime-tokio", "time", "tls-rustls-ring-webpki", "uuid"] }
thiserror = "=2.0.19"
time = { version = "=0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "=0.26.4"
tokio-util = { version = "=0.7.19", features = ["rt"] }
tower = { version = "=0.5.3", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "=0.7.0", features = ["catch-panic", "request-id", "trace"] }
tracing = "=0.1.44"
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
url = "=2.5.7"
uuid = { version = "=1.24.0", features = ["serde", "std", "v7"] }
volo = { version = "=0.12.3", features = ["rustls-ring"] }
volo-thrift = "=0.12.5"
yrs = { version = "=0.27.3", default-features = false, features = ["sync"] }
zeroize = "=1.9.0"

[lints]
workspace = true
