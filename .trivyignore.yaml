vulnerabilities:
  - id: CVE-2026-41602
    paths:
      - app/gateway
    purls:
      - pkg:golang/github.com/apache/thrift@v0.13.0
    statement: >-
      Gateway uses Hertz-generated HTTP models and never constructs or calls
      TFramedTransport; govulncheck reports the vulnerable symbols unreachable.
      Hertz v0.9.7 with thriftgo v0.4.5 still requires the pre-context Thrift API.
    expired_at: 2026-11-06
