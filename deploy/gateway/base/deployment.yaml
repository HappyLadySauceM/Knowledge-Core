apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-core-gateway
  labels:
    app.kubernetes.io/name: knowledge-core-gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: knowledge-core
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: knowledge-core-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-core-gateway
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: knowledge-core
        app.kubernetes.io/managed-by: kustomize
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8082"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: knowledge-core-gateway
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: knowledge-core-gateway-config
            - secretRef:
                name: knowledge-core-gateway-secrets
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 8082
          startupProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nacos-runtime
              mountPath: /var/run/knowledge-core/nacos
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nacos-runtime
          emptyDir:
            sizeLimit: 32Mi
