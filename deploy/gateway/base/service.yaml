apiVersion: v1
kind: Service
metadata:
  name: knowledge-core-gateway
  labels:
    app.kubernetes.io/name: knowledge-core-gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: knowledge-core
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app.kubernetes.io/name: knowledge-core-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: admin
      port: 8082
      targetPort: admin
