apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: knowledge-core-ci
spec:
  entrypoint: ci
  onExit: final-status
  serviceAccountName: knowledge-core-workflow
  activeDeadlineSeconds: 3600
  securityContext:
    runAsNonRoot: true
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  synchronization:
    mutexes:
      - name: knowledge-core-heavy
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 5m
  volumeClaimGC:
    strategy: OnWorkflowCompletion
  ttlStrategy:
    secondsAfterCompletion: 86400
  arguments:
    parameters:
      - name: repository
        value: HappyLadySauceM/Knowledge-Core
      - name: revision
      - name: ref
      - name: mode
        value: verify
        enum: [verify, release]
      - name: gitops-repository
        value: HappyLadySauceM/k3s-home-deploy
      - name: image-registry
        value: harbor.happyladysauce.local
      - name: image-namespace
        value: knowledge-core
      - name: control-image
        value: harbor.happyladysauce.local/knowledge-core/ci-control@sha256:61bffcb40a1900009ccb256836e5740afb6acb6367fca2ba02dd3a39e0e2e09b
      - name: go-image
        value: harbor.happyladysauce.local/knowledge-core/ci-go@sha256:7f30a4f81017fc3a7257f90d5f8d070a76fb8fe1cb8a9c98e07aa462c4b895d0
      - name: rust-image
        value: harbor.happyladysauce.local/knowledge-core/ci-rust@sha256:1d7ef2a7cbfec82093b3fb5320f1be6babae2d1c103ed743eb7249eea5655fa8
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 12Gi
  volumes:
    - name: cache
      persistentVolumeClaim:
        claimName: knowledge-core-ci-cache
    - name: buildkit-cache
      persistentVolumeClaim:
        claimName: knowledge-core-buildkit-cache
    - name: github-app
      secret:
        secretName: knowledge-core-github-app
        items:
          - key: private-key
            path: private-key.pem
    - name: harbor-auth
      secret:
        secretName: knowledge-core-harbor-push
        items:
          - key: .dockerconfigjson
            path: config.json
    - name: harbor-ca
      configMap:
        name: knowledge-core-harbor-ca
        items:
          - key: ca.crt
            path: ca.crt
    - name: buildkit-config
      configMap:
        name: knowledge-core-buildkit
        items:
          - key: buildkitd.toml
            path: buildkitd.toml
    - name: cosign
      secret:
        secretName: knowledge-core-cosign
        items:
          - key: cosign.key
            path: cosign.key
  templates:
    - name: ci
      dag:
        tasks:
          - name: validate-mode
            template: validate-mode
          - name: pending
            depends: validate-mode.Succeeded
            template: github-status
            arguments:
              parameters:
                - name: state
                  value: pending
                - name: description
                  value: Knowledge Core CI started
          - name: checkout
            depends: pending.Succeeded
            template: checkout
          - name: node
            depends: checkout.Succeeded
            template: node
          - name: go
            depends: checkout.Succeeded
            template: go
          - name: rust
            depends: checkout.Succeeded
            template: rust
          - name: interoperability
            depends: go.Succeeded && rust.Succeeded
            template: interoperability
          - name: current-ref
            depends: node.Succeeded && interoperability.Succeeded
            template: verify-ref
          - name: build
            depends: current-ref.Succeeded
            template: build
          - name: collect
            depends: build.Succeeded
            template: collect
          - name: scan
            depends: collect.Succeeded
            template: scan-images
          - name: smoke-pending
            depends: scan.Succeeded
            when: "{{workflow.parameters.mode}} == release"
            template: smoke-status
            arguments:
              parameters:
                - name: state
                  value: pending
                - name: description
                  value: Knowledge Core dev deployment started
          - name: promote-gitops
            depends: smoke-pending.Succeeded
            when: "{{workflow.parameters.mode}} == release"
            template: promote-gitops
          - name: wait-gitops
            depends: promote-gitops.Succeeded
            template: wait-gitops
            arguments:
              parameters:
                - name: revision
                  value: "{{tasks.promote-gitops.outputs.parameters.revision}}"
          - name: smoke
            depends: wait-gitops.Succeeded
            template: smoke-dev
          - name: rollback
            depends: wait-gitops.Failed || wait-gitops.Errored || smoke.Failed || smoke.Errored
            template: rollback-gitops
            arguments:
              parameters:
                - name: previous-revision
                  value: "{{tasks.promote-gitops.outputs.parameters.previous-revision}}"
                - name: promoted-revision
                  value: "{{tasks.promote-gitops.outputs.parameters.revision}}"
                - name: changed
                  value: "{{tasks.promote-gitops.outputs.parameters.changed}}"
          - name: sign
            depends: smoke.Succeeded
            template: sign-image
            arguments:
              parameters:
                - name: ref
                  value: "{{item.ref}}"
            withParam: "{{tasks.collect.outputs.parameters.images}}"
          - name: promote-main
            depends: sign.Succeeded
            template: promote-main
          - name: tag-images
            depends: promote-main.Succeeded
            template: tag-release-images
          - name: publish-release
            depends: tag-images.Succeeded
            template: publish-release

    - name: validate-mode
      container:
        image: "{{workflow.parameters.control-image}}"
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-euc"]
        args:
          - |
            case "{{workflow.parameters.mode}}" in
              verify|release) ;;
              *) printf 'unsupported workflow mode\n' >&2; exit 2 ;;
            esac
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
        securityContext: &restricted
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault

    - name: github-status
      inputs:
        parameters:
          - name: state
          - name: description
      container:
        image: "{{workflow.parameters.control-image}}"
        imagePullPolicy: IfNotPresent
        envFrom: &proxy-env
          - configMapRef:
              name: knowledge-core-ci-proxy
        command: ["/bin/bash", "-euo", "pipefail", "-c"]
        args:
          - |
            token="$(/usr/local/lib/knowledge-core-ci/github-app-token.sh)"
            export GITHUB_TOKEN="$token"
            /usr/local/lib/knowledge-core-ci/github-status.sh \
              "{{inputs.parameters.state}}" "{{inputs.parameters.description}}"
        env:
          - name: GITHUB_APP_ID
            valueFrom:
              secretKeyRef:
                name: knowledge-core-github-app
                key: app-id
          - name: GITHUB_APP_INSTALLATION_ID
            valueFrom:
              secretKeyRef:
                name: knowledge-core-github-app
                key: installation-id
          - name: GITHUB_APP_PRIVATE_KEY_FILE
            value: /secrets/github/private-key.pem
          - name: GITHUB_REPOSITORY
            value: "{{workflow.parameters.repository}}"
          - name: GITHUB_SHA
            value: "{{workflow.parameters.revision}}"
        volumeMounts:
          - name: github-app
            mountPath: /secrets/github
            readOnly: true
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        securityContext: *restricted

    - name: checkout
      container:
        image: "{{workflow.parameters.control-image}}"
        imagePullPolicy: IfNotPresent
        envFrom: *proxy-env
        command: ["/bin/bash", "-euo", "pipefail", "-c"]
        args:
          - |
            token="$(/usr/local/lib/knowledge-core-ci/github-app-token.sh)"
            export GITHUB_TOKEN="$token"
            /usr/local/lib/knowledge-core-ci/checkout.sh
        env:
          - name: GITHUB_APP_ID
            valueFrom:
              secretKeyRef: {name: knowledge-core-github-app, key: app-id}
          - name: GITHUB_APP_INSTALLATION_ID
            valueFrom:
              secretKeyRef: {name: knowledge-core-github-app, key: installation-id}
          - name: GITHUB_APP_PRIVATE_KEY_FILE
            value: /secrets/github/private-key.pem
          - name: GITHUB_REPOSITORY
            value: "{{workflow.parameters.repository}}"
          - name: GITHUB_SHA
            value: "{{workflow.parameters.revision}}"
          - name: WORKSPACE
            value: /workspace/source
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
          - {name: github-app, mountPath: /secrets/github, readOnly: true}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext: *restricted

    - name: node
      container:
        image: docker.m.daocloud.io/library/node:24.18.1-bookworm-slim@sha256:235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7
        imagePullPolicy: IfNotPresent
        envFrom: *proxy-env
        command: ["/bin/sh", "-euc"]
        args:
          - |
            mkdir -p "$HOME" "$npm_config_cache"
            cd /workspace/source/services/collaboration/interop
            npm ci
            npm run ci
        env:
          - {name: HOME, value: /tmp/knowledge-core-node-ci}
          - {name: npm_config_cache, value: /cache/npm}
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
          - {name: cache, mountPath: /cache}
          - {name: tmp, mountPath: /tmp}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
        securityContext: *restricted
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}

    - name: go
      container:
        image: "{{workflow.parameters.go-image}}"
        imagePullPolicy: IfNotPresent
        envFrom: *proxy-env
        command: ["/bin/bash", "-euo", "pipefail", "-c"]
        args:
          - |
            mkdir -p "$HOME" "$GOCACHE" "$GOMODCACHE" "$GOPATH" /workspace/interop/certs
            cd /workspace/source
            make go-ci
            make race
            go build -trimpath -o /workspace/interop/go-interop ./tools/interop
            KC_INTEROP_CERT_DIR=/workspace/interop/certs /workspace/interop/go-interop certs
        env:
          - {name: HOME, value: /tmp/knowledge-core-go-ci}
          - {name: GOPROXY, value: "https://goproxy.cn,direct"}
          - {name: GOCACHE, value: /cache/go-build}
          - {name: GOMODCACHE, value: /cache/go-mod}
          - {name: GOPATH, value: /cache/gopath}
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
          - {name: cache, mountPath: /cache}
          - {name: tmp, mountPath: /tmp}
        resources:
          requests: {cpu: 100m, memory: 1Gi}
          limits: {cpu: "2", memory: 6Gi}
        securityContext: *restricted
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 4Gi}

    - name: rust
      container:
        image: "{{workflow.parameters.rust-image}}"
        imagePullPolicy: IfNotPresent
        envFrom: *proxy-env
        command: ["/bin/bash", "-euo", "pipefail", "-c"]
        args:
          - |
            for port in 5432 6379 4222 2379; do
              ready=false
              for _ in $(seq 1 90); do
                if (echo >/dev/tcp/127.0.0.1/$port) >/dev/null 2>&1; then ready=true; break; fi
                sleep 1
              done
              if [[ "$ready" != true ]]; then echo "dependency port $port is not ready" >&2; exit 1; fi
            done
            mkdir -p "$HOME" "$CARGO_HOME" "$CARGO_TARGET_DIR" /workspace/interop
            install -m 0644 /usr/local/cargo/config.toml "$CARGO_HOME/config.toml"
            cd /workspace/source
            bash scripts/ci/fetch-rustsec.sh
            CARGO_DENY="cargo deny --offline" make rust-ci
            install -D -m 0755 \
              "$CARGO_TARGET_DIR/release/knowledge-core-collaboration" \
              /workspace/source/.ci-artifacts/knowledge-core-collaboration
            cd services/collaboration
            cargo build --locked --bin volo_interop_fixture
            install -m 0755 "$CARGO_TARGET_DIR/debug/volo_interop_fixture" /workspace/interop/rust-interop
        env:
          - {name: HOME, value: /tmp/knowledge-core-rust-ci}
          - {name: CARGO_HOME, value: /cache/cargo-home}
          - {name: CARGO_TARGET_DIR, value: /cache/cargo-target}
          - {name: CARGO_HTTP_MULTIPLEXING, value: "false"}
          - {name: CARGO_HTTP_TIMEOUT, value: "60"}
          - {name: CARGO_NET_RETRY, value: "5"}
          - {name: GIT_TERMINAL_PROMPT, value: "0"}
          - {name: GIT_CONFIG_COUNT, value: "3"}
          - {name: GIT_CONFIG_KEY_0, value: http.version}
          - {name: GIT_CONFIG_VALUE_0, value: HTTP/1.1}
          - {name: GIT_CONFIG_KEY_1, value: http.lowSpeedLimit}
          - {name: GIT_CONFIG_VALUE_1, value: "1"}
          - {name: GIT_CONFIG_KEY_2, value: http.lowSpeedTime}
          - {name: GIT_CONFIG_VALUE_2, value: "60"}
          - {name: COLLABORATION_TEST_REQUIRE_REAL_DEPENDENCIES, value: "1"}
          - {name: COLLABORATION_TEST_POSTGRES_URL, value: "postgres://knowledge_core@127.0.0.1:5432/knowledge_core"}
          - {name: COLLABORATION_TEST_REDIS_URL, value: "redis://127.0.0.1:6379/0"}
          - {name: COLLABORATION_TEST_NATS_URL, value: "nats://127.0.0.1:4222"}
          - {name: COLLABORATION_TEST_ETCD_ENDPOINTS, value: "http://127.0.0.1:2379"}
          - name: COLLABORATION_TEST_POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef: {name: knowledge-core-ci-test-dependencies, key: postgres-password}
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
          - {name: cache, mountPath: /cache}
          - {name: tmp, mountPath: /tmp}
        resources:
          requests: {cpu: 100m, memory: 2Gi}
          limits: {cpu: "2", memory: 8Gi}
        securityContext: *restricted
      sidecars:
        - name: postgres
          image: docker.m.daocloud.io/library/postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
          env:
            - {name: POSTGRES_USER, value: knowledge_core}
            - {name: POSTGRES_DB, value: knowledge_core}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: knowledge-core-ci-test-dependencies, key: postgres-password}
          volumeMounts:
            - {name: postgres-data, mountPath: /var/lib/postgresql/data}
            - {name: postgres-run, mountPath: /var/run/postgresql}
            - {name: sidecar-tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        - name: redis
          image: docker.m.daocloud.io/library/redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
          args: ["redis-server", "--save", ""]
          volumeMounts:
            - {name: redis-data, mountPath: /data}
            - {name: sidecar-tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        - name: nats
          image: docker.m.daocloud.io/library/nats:2.11-alpine@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
          args: ["-js", "-sd", "/data", "-m", "8222"]
          volumeMounts:
            - {name: nats-data, mountPath: /data}
            - {name: sidecar-tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        - name: etcd
          image: quay.io/coreos/etcd@sha256:3f179425019536765a47fecff29221ed4453a4f4e91aa33e21e1a2326079ad9e
          command: ["/usr/local/bin/etcd"]
          args:
            - --name=knowledge-core-ci
            - --data-dir=/data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://127.0.0.1:2379
          volumeMounts:
            - {name: etcd-data, mountPath: /data}
            - {name: sidecar-tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 10m, memory: 96Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 4Gi}
        - name: sidecar-tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: postgres-data
          emptyDir: {sizeLimit: 1Gi}
        - name: postgres-run
          emptyDir: {sizeLimit: 16Mi}
        - name: redis-data
          emptyDir: {sizeLimit: 256Mi}
        - name: nats-data
          emptyDir: {sizeLimit: 512Mi}
        - name: etcd-data
          emptyDir: {sizeLimit: 256Mi}

    - name: interoperability
      container:
        image: "{{workflow.parameters.go-image}}"
        imagePullPolicy: IfNotPresent
        envFrom: *proxy-env
        command: ["/bin/bash", "/workspace/source/scripts/ci/run-interop.sh"]
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
          - {name: tmp, mountPath: /tmp}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        securityContext: *restricted
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}

    - name: verify-ref
      container:
        image: "{{workflow.parameters.control-image}}"
        imagePullPolicy: IfNotPresent
        envFrom: *proxy-env
        command: ["/bin/bash", "-euo", "pipefail", "-c"]
        args:
          - |
            token="$(/usr/local/lib/knowledge-core-ci/github-app-token.sh)"
            export GITHUB_TOKEN="$token"
            /usr/local/lib/knowledge-core-ci/verify-ref.sh
        env: &github-env
          - name: GITHUB_APP_ID
            valueFrom:
              secretKeyRef: {name: knowledge-core-github-app, key: app-id}
          - name: GITHUB_APP_INSTALLATION_ID
            valueFrom:
              secretKeyRef: {name: knowledge-core-github-app, key: installation-id}
          - {name: GITHUB_APP_PRIVATE_KEY_FILE, value: /secrets/github/private-key.pem}
          - {name: GITHUB_REPOSITORY, value: "{{workflow.parameters.repository}}"}
          - {name: GITHUB_SHA, value: "{{workflow.parameters.revision}}"}
          - {name: GITHUB_REF, value: "{{workflow.parameters.ref}}"}
        volumeMounts:
          - {name: github-app, mountPath: /secrets/github, readOnly: true}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        securityContext: *restricted

    - name: build
      podSpecPatch: |-
        securityContext:
          runAsNonRoot: true
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      container:
        image: moby/buildkit@sha256:66e5fe5b25509626c0e628c6e57badbcc2e8a62218ba3e1358f1427e90de6a88
        imagePullPolicy: IfNotPresent
        envFrom: *proxy-env
        command: ["/bin/sh", "/workspace/source/scripts/ci/build-images.sh"]
        env:
          - {name: HOME, value: /home/user}
          - {name: SOURCE_ROOT, value: /workspace/source}
          - {name: GITHUB_SHA, value: "{{workflow.parameters.revision}}"}
          - {name: IMAGE_REGISTRY, value: "{{workflow.parameters.image-registry}}"}
          - {name: IMAGE_NAMESPACE, value: "{{workflow.parameters.image-namespace}}"}
          - {name: GOPROXY, value: "https://goproxy.cn,direct"}
          - {name: DOCKER_CONFIG, value: /home/user/.docker}
          - {name: XDG_RUNTIME_DIR, value: /run/user/1000}
          - {name: TMPDIR, value: /tmp}
          - {name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/knowledge-core/harbor"}
          - {name: BUILDKITD_FLAGS, value: "--oci-worker-no-process-sandbox --config=/etc/buildkit/buildkitd.toml"}
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
          - {name: buildkit-cache, mountPath: /home/user/.local/share/buildkit}
          - {name: harbor-auth, mountPath: /home/user/.docker, readOnly: true}
          - {name: harbor-ca, mountPath: /etc/knowledge-core/harbor, readOnly: true}
          - {name: buildkit-config, mountPath: /etc/buildkit, readOnly: true}
          - {name: buildkit-runtime, mountPath: /run/user/1000}
          - {name: tmp, mountPath: /tmp}
        resources:
          requests: {cpu: 250m, memory: 1Gi}
          limits: {cpu: "4", memory: 8Gi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          # rootlesskit needs the newuidmap setuid helper to create its user namespace.
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["SETUID", "SETGID"]
          seccompProfile:
            type: Unconfined
          appArmorProfile:
            type: Unconfined
      volumes:
        - name: buildkit-runtime
          emptyDir: {sizeLimit: 256Mi}
        - name: tmp
          emptyDir: {sizeLimit: 2Gi}

    - name: collect
      outputs:
        parameters:
          - name: images
            valueFrom:
              path: /workspace/release/images.json
      container:
        image: "{{workflow.parameters.control-image}}"
        imagePullPolicy: IfNotPresent
        envFrom: *proxy-env
        command: ["/bin/bash", "/workspace/source/scripts/ci/collect-images.sh"]
        env:
          - {name: GITHUB_SHA, value: "{{workflow.parameters.revision}}"}
          - {name: IMAGE_REGISTRY, value: "{{workflow.parameters.image-registry}}"}
          - {name: IMAGE_NAMESPACE, value: "{{workflow.parameters.image-namespace}}"}
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        securityContext: *restricted

    - name: scan-images
      synchronization:
        mutexes:
          - name: knowledge-core-trivy-cache
      container:
        image: aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
        imagePullPolicy: IfNotPresent
        envFrom: *proxy-env
        command: ["/bin/sh", "/workspace/source/scripts/ci/scan-images.sh"]
        env:
          - {name: HOME, value: /tmp}
          - {name: DOCKER_CONFIG, value: /secrets/harbor}
          - {name: TRIVY_CACHE_DIR, value: /cache/trivy}
          - {name: IMAGE_MAP_FILE, value: /workspace/release/images.env}
          - {name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/knowledge-core/harbor"}
        volumeMounts:
          - {name: workspace, mountPath: /workspace, readOnly: true}
          - {name: cache, mountPath: /cache}
          - {name: harbor-auth, mountPath: /secrets/harbor, readOnly: true}
          - {name: harbor-ca, mountPath: /etc/knowledge-core/harbor, readOnly: true}
          - {name: tmp, mountPath: /tmp}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
        securityContext: *restricted
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}

    - name: sign-image
      inputs:
        parameters:
          - name: ref
      container:
        image: ghcr.io/sigstore/cosign/cosign@sha256:d91bc4e7e95e8d2f549c747a72dc174f90579e410a1695f57f686674f84ce849
        imagePullPolicy: IfNotPresent
        envFrom: *proxy-env
        command: ["/ko-app/cosign"]
        args: ["sign", "--yes", "--key", "/secrets/cosign/cosign.key", "{{inputs.parameters.ref}}"]
        env:
          - {name: HOME, value: /tmp}
          - name: COSIGN_PASSWORD
            valueFrom:
              secretKeyRef: {name: knowledge-core-cosign, key: cosign.password}
          - {name: DOCKER_CONFIG, value: /secrets/harbor}
          - {name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/knowledge-core/harbor"}
        volumeMounts:
          - {name: harbor-auth, mountPath: /secrets/harbor, readOnly: true}
          - {name: harbor-ca, mountPath: /etc/knowledge-core/harbor, readOnly: true}
          - {name: cosign, mountPath: /secrets/cosign, readOnly: true}
          - {name: tmp, mountPath: /tmp}
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {cpu: 250m, memory: 256Mi}
        securityContext: *restricted
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}

    - name: promote-gitops
      outputs:
