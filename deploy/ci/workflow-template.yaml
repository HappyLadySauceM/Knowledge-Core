      container:
        image: "{{workflow.parameters.control-image}}"
        imagePullPolicy: IfNotPresent
        envFrom: *proxy-env
        command: ["/bin/bash", "/workspace/source/scripts/ci/wait-gitops.sh"]
        env:
          - {name: GITOPS_REVISION, value: "{{inputs.parameters.revision}}"}
          - {name: IMAGE_MAP_FILE, value: /workspace/release/images.env}
