        args:
          - |
            token="$(/usr/local/lib/knowledge-core-ci/github-app-token.sh)"
            export GITHUB_TOKEN="$token"
            bash /workspace/source/scripts/ci/promote-main.sh
        env:
          - name: GITHUB_APP_ID
            valueFrom:
              secretKeyRef: {name: knowledge-core-github-app, key: app-id}
          - name: GITHUB_APP_INSTALLATION_ID
            valueFrom:
              secretKeyRef: {name: knowledge-core-github-app, key: installation-id}
          - {name: GITHUB_APP_PRIVATE_KEY_FILE, value: /secrets/github/private-key.pem}
          - {name: GITHUB_REPOSITORY, value: "{{workflow.parameters.repository}}"}
          - {name: GITHUB_SHA, value: "{{workflow.parameters.revision}}"}
          - {name: GITHUB_REF, value: "{{workflow.parameters.ref}}"}
          - {name: SOURCE_ROOT, value: /workspace/source}
          - {name: OUTPUT_ROOT, value: /workspace/release}
        volumeMounts:
