          - {name: github-app, mountPath: /secrets/github, readOnly: true}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        securityContext: *restricted

    - name: tag-release-images
      container:
        image: "{{workflow.parameters.control-image}}"
        imagePullPolicy: IfNotPresent
        envFrom: *proxy-env
        command: ["/bin/bash", "/workspace/source/scripts/ci/tag-release-images.sh"]
        env:
          - {name: IMAGE_MAP_FILE, value: /workspace/release/images.env}
          - {name: VERSION_FILE, value: /workspace/release/version}
          - {name: IMAGE_REGISTRY, value: "{{workflow.parameters.image-registry}}"}
          - {name: DOCKER_CONFIG, value: /secrets/harbor}
          - {name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/knowledge-core/harbor"}
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
          - {name: harbor-auth, mountPath: /secrets/harbor, readOnly: true}
          - {name: harbor-ca, mountPath: /etc/knowledge-core/harbor, readOnly: true}
          - {name: tmp, mountPath: /tmp}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        securityContext: *restricted
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}

    - name: publish-release
      container:
        image: "{{workflow.parameters.control-image}}"
        imagePullPolicy: IfNotPresent
        envFrom: *proxy-env
        command: ["/bin/bash", "-euo", "pipefail", "-c"]
        args:
          - |
            token="$(/usr/local/lib/knowledge-core-ci/github-app-token.sh)"
            export GITHUB_TOKEN="$token"
            VERSION_FILE=/workspace/release/version \
              bash /workspace/source/scripts/ci/publish-release.sh
        env: *github-env
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
          - {name: github-app, mountPath: /secrets/github, readOnly: true}
          - {name: tmp, mountPath: /tmp}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        securityContext: *restricted
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}

    - name: final-status
      container:
        image: "{{workflow.parameters.control-image}}"
        imagePullPolicy: IfNotPresent
        envFrom: *proxy-env
        command: ["/bin/bash", "-euo", "pipefail", "-c"]
        args:
          - |
            case "{{workflow.status}}" in
              Succeeded) state=success; description='Knowledge Core CI passed' ;;
              Error) state=error; description='Knowledge Core CI infrastructure error' ;;
              *) state=failure; description='Knowledge Core CI failed' ;;
            esac
            token="$(/usr/local/lib/knowledge-core-ci/github-app-token.sh)"
            export GITHUB_TOKEN="$token"
            /usr/local/lib/knowledge-core-ci/github-status.sh "$state" "$description"
            if [[ "{{workflow.parameters.mode}}" == release && \
                  "$state" != success && \
                  ! -f /workspace/release/smoke-passed && \
                  -r /workspace/source/scripts/ci/github-status.sh ]]; then
              bash /workspace/source/scripts/ci/github-status.sh \
                failure 'Knowledge Core dev smoke did not pass' knowledge-core/smoke
            fi
        env:
          - name: GITHUB_APP_ID
            valueFrom:
              secretKeyRef: {name: knowledge-core-github-app, key: app-id}
          - name: GITHUB_APP_INSTALLATION_ID
            valueFrom:
              secretKeyRef: {name: knowledge-core-github-app, key: installation-id}
          - {name: GITHUB_APP_PRIVATE_KEY_FILE, value: /secrets/github/private-key.pem}
          - {name: GITHUB_REPOSITORY, value: "{{workflow.parameters.repository}}"}
          - {name: GITHUB_SHA, value: "{{workflow.parameters.revision}}"}
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
          - {name: github-app, mountPath: /secrets/github, readOnly: true}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        securityContext: *restricted
