apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
spec:
  jetstreamExotic:
    url: nats://nats.nats.svc.cluster.local:4222
    accessSecret:
      name: knowledge-core-argo-events-nats
      key: auth.yaml
    streamConfig: |
      maxAge: 24h
      maxBytes: 1GB
      replicas: 1
      duplicates: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: knowledge-core
spec:
  eventBusName: default
  template:
    serviceAccountName: knowledge-core-events
  service:
    ports:
      - name: knowledge-core
        port: 12000
        targetPort: 12000
  github:
    knowledge-core:
      repositories:
        - owner: HappyLadySauceM
          names: ["Knowledge-Core"]
      webhook:
        endpoint: /events/knowledge-core
        port: "12000"
        method: POST
        url: https://hooks.happyladysauce.cn/events/knowledge-core
      events: ["push"]
      webhookSecret:
        name: knowledge-core-github-webhook
        key: secret
      insecure: false
      active: true
      contentType: json
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: knowledge-core
spec:
  eventBusName: default
  template:
    serviceAccountName: knowledge-core-events
  dependencies:
    - name: push
      eventSourceName: knowledge-core
      eventName: knowledge-core
      filters:
        data:
          - path: headers.X-Github-Event
            type: string
            value: ["push"]
          - path: body.repository.full_name
            type: string
            value: ["HappyLadySauceM/Knowledge-Core"]
          - path: body.deleted
            type: bool
            value: ["false"]
          - path: body.ref
            type: string
            value: ["refs/heads/dev"]
  triggers:
    - template:
        name: knowledge-core-ci
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: knowledge-core-ci
              spec:
                workflowTemplateRef:
                  name: knowledge-core-ci
                arguments:
                  parameters:
                    - {name: repository, value: HappyLadySauceM/Knowledge-Core}
                    - {name: revision}
                    - {name: ref}
                    - {name: mode, value: release}
          parameters:
            - src:
                dependencyName: push
                dataTemplate: "knowledge-core-ci-{{ .Input.body.after }}"
              dest: metadata.name
            - src:
                dependencyName: push
                dataKey: body.after
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: push
                dataKey: body.ref
              dest: spec.arguments.parameters.2.value
      retryStrategy:
        steps: 3
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge-core-webhook
  annotations:
    higress.io/enable-rewrite: "false"
spec:
  ingressClassName: higress
  rules:
    - host: hooks.happyladysauce.local
      http:
        paths:
          - path: /events/knowledge-core
            pathType: Exact
            backend:
              service:
                name: knowledge-core-eventsource-svc
                port:
                  number: 12000
    - host: hooks.happyladysauce.cn
      http:
        paths:
          - path: /events/knowledge-core
            pathType: Exact
            backend:
              service:
                name: knowledge-core-eventsource-svc
                port:
                  number: 12000
