apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledge-core-ci-proxy
data:
  HTTP_PROXY: http://10.42.0.1:10992
  HTTPS_PROXY: http://10.42.0.1:10992
  NO_PROXY: 127.0.0.1,localhost,::1,10.42.0.0/16,10.43.0.0/16,100.100.100.2,192.168.110.2,kubernetes.default.svc,.svc,.svc.cluster.local,happyladysauce.local,.happyladysauce.local,happyladysauce.cn,.happyladysauce.cn
  http_proxy: http://10.42.0.1:10992
  https_proxy: http://10.42.0.1:10992
  no_proxy: 127.0.0.1,localhost,::1,10.42.0.0/16,10.43.0.0/16,100.100.100.2,192.168.110.2,kubernetes.default.svc,.svc,.svc.cluster.local,happyladysauce.local,.happyladysauce.local,happyladysauce.cn,.happyladysauce.cn
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledge-core-ci-proxy-forwarder
data:
  connect.sh: |
    #!/bin/sh
    exec nc 127.0.0.1 10991
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-core-ci-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: knowledge-core-ci-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-core-ci-proxy
    spec:
      automountServiceAccountToken: false
      serviceAccountName: knowledge-core-workflow
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: home
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forwarder
          image: harbor.happyladysauce.local/knowledge-core/ci-control@sha256:61bffcb40a1900009ccb256836e5740afb6acb6367fca2ba02dd3a39e0e2e09b
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -c]
          args:
            - exec nc -lk -s 10.42.0.1 -p 10992 -e /scripts/connect.sh
          ports:
            - name: proxy
              containerPort: 10992
              protocol: TCP
          startupProbe: &proxy-probe
            exec:
              command: [/bin/sh, -c, "nc -z -w 1 10.42.0.1 10992"]
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          readinessProbe: *proxy-probe
          livenessProbe:
            exec:
              command: [/bin/sh, -c, "nc -z -w 1 10.42.0.1 10992"]
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: knowledge-core-ci-proxy-forwarder
            defaultMode: 365
