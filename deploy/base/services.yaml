apiVersion: v1
kind: Service
metadata:
  name: knowledge-core-gateway
  labels:
    app.kubernetes.io/name: knowledge-core-gateway
    app.kubernetes.io/component: edge
spec:
  selector:
    app.kubernetes.io/name: knowledge-core-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: admin
      port: 8082
      targetPort: admin
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-core-identity
  labels:
    app.kubernetes.io/name: knowledge-core-identity
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: knowledge-core-identity
  ports:
    - name: rpc
      port: 8881
      targetPort: rpc
    - name: admin
      port: 8081
      targetPort: admin
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-core-knowledge
  labels:
    app.kubernetes.io/name: knowledge-core-knowledge
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: knowledge-core-knowledge
  ports:
    - name: rpc
      port: 8882
      targetPort: rpc
    - name: admin
      port: 8083
      targetPort: admin
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-core-collaboration
  labels:
    app.kubernetes.io/name: knowledge-core-collaboration
    app.kubernetes.io/component: realtime
spec:
  selector:
    app.kubernetes.io/name: knowledge-core-collaboration
  ports:
    - name: websocket
      port: 8091
      targetPort: websocket
    - name: rpc
      port: 8883
      targetPort: rpc
    - name: admin
      port: 8084
      targetPort: admin
