apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-core-collaboration
  labels:
    app.kubernetes.io/name: knowledge-core-collaboration
    app.kubernetes.io/component: realtime
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: knowledge-core-collaboration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-core-collaboration
        app.kubernetes.io/component: realtime
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8084"
    spec:
      serviceAccountName: knowledge-core-collaboration
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collaboration
          image: knowledge-core-collaboration
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLABORATION_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: knowledge-core-common-config
            - configMapRef:
                name: knowledge-core-collaboration-config
            - secretRef:
                name: knowledge-core-collaboration-secrets
          ports:
            - name: websocket
              containerPort: 8091
            - name: rpc
              containerPort: 8883
            - name: admin
              containerPort: 8084
          startupProbe:
            httpGet:
              path: /health/live
              port: admin
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: admin
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
