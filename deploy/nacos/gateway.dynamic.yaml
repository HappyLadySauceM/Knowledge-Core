api_version: knowledge-core.io/v1beta1
kind: ApplicationConfig
service: gateway
revision: 4
config:
  app:
    name: gateway
    environment: development
    startup_timeout: 30s
    shutdown_timeout: 35s
  log:
    level: info
    add_source: false
    health_check_requests: false
  trace:
    enabled: false
    endpoint: otel-collector.monitoring.svc.cluster.local:4317
    sample_ratio: 0.1
    insecure: true
    batch_timeout: 5s
    export_timeout: 10s
    tls: {enabled: false}
  public_http:
    address: :8080
    read_timeout: 10s
    write_timeout: 30s
    idle_timeout: 2m
    shutdown_timeout: 15s
    max_request_body_size: 4194304
    tls: {enabled: false}
  admin_http:
    address: :8082
    read_timeout: 10s
    write_timeout: 30s
    idle_timeout: 2m
    shutdown_timeout: 15s
    max_request_body_size: 4194304
    tls: {enabled: false}
  redis:
    address: redis-master.infrastructure-dev.svc.cluster.local:6379
    db: 0
    dial_timeout: 5s
    read_timeout: 3s
    write_timeout: 3s
    pool_size: 20
    min_idle_conns: 2
    max_retries: 3
    tls: {enabled: false}
  identity_rpc: {service_name: knowledge-core.identity, address: knowledge-core-identity.knowledge-core-dev.svc.cluster.local:8881, connect_timeout: 500ms, request_timeout: 3s, tls: {enabled: false}}
  knowledge_rpc: {service_name: knowledge-core.knowledge, address: knowledge-core-knowledge.knowledge-core-dev.svc.cluster.local:8882, connect_timeout: 500ms, request_timeout: 5s, tls: {enabled: false}}
  collaboration_rpc: {service_name: knowledge-core.collaboration, address: knowledge-core-collaboration.knowledge-core-dev.svc.cluster.local:8883, connect_timeout: 500ms, request_timeout: 5s, tls: {enabled: false}}
  attachment_rpc: {service_name: knowledge-core.attachment, address: knowledge-core-attachment.knowledge-core-dev.svc.cluster.local:8884, connect_timeout: 500ms, request_timeout: 10s, tls: {enabled: false}}
  platform_rpc: {service_name: knowledge-core.platform, address: knowledge-core-platform.knowledge-core-dev.svc.cluster.local:8885, connect_timeout: 500ms, request_timeout: 5s, tls: {enabled: false}}
  endpoints:
    public_base_url: https://knowledge-core.happyladysauce.local
    collaboration_websocket_base_url: wss://knowledge-core.happyladysauce.local
    site_title: HappyLadySauce
    site_tagline_zh: 把值得留下的想法，写成值得阅读的文章。
    site_tagline_en: Turn ideas worth keeping into pages worth reading.
    site_hero_image_url: /images/home-hero.png
    site_hero_focal_x: 50
    site_hero_focal_y: 50
  cors:
    allowed_origins: [https://knowledge-core.happyladysauce.local]
    trusted_proxy_cidrs: []
  rate_limit:
    key_prefix: knowledge-core:development:gateway:rate-limit
    window: 1m
    global_limit: 300
    auth_limit: 20
