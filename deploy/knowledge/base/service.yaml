apiVersion: v1
kind: Service
metadata:
  name: knowledge-core-knowledge
  labels:
    app.kubernetes.io/name: knowledge-core-knowledge
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: knowledge-core
    app.kubernetes.io/managed-by: kustomize
spec:
  # RPC clients probe these pods before HTTP readiness; include not-ready endpoints.
  # RPC 客户端会在 HTTP Ready 之前探活，需要把未 Ready 的 Pod 也加入 Endpoints。
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: knowledge-core-knowledge
  ports:
    - name: rpc
      port: 8882
      targetPort: rpc
    - name: admin
      port: 8083
      targetPort: admin
