apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-core-knowledge
  labels:
    app.kubernetes.io/name: knowledge-core-knowledge
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: knowledge-core
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: knowledge-core-knowledge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-core-knowledge
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: knowledge-core
        app.kubernetes.io/managed-by: kustomize
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8083"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: knowledge
          image: knowledge-core-knowledge
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: knowledge-core-knowledge-config
            - secretRef:
                name: knowledge-core-knowledge-secrets
          ports:
            - name: rpc
              containerPort: 8882
            - name: admin
              containerPort: 8083
          startupProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nacos-runtime
              mountPath: /var/run/knowledge-core/nacos
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: nacos-runtime
          emptyDir:
            sizeLimit: 32Mi
