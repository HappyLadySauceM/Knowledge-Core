apiVersion: v1
kind: Service
metadata:
  name: knowledge-core-nats
  namespace: knowledge-core-platform
spec:
  selector:
    app.kubernetes.io/name: knowledge-core-nats
  ports:
    - {name: client, port: 4222, targetPort: client}
    - {name: monitor, port: 8222, targetPort: monitor}
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-core-etcd
  namespace: knowledge-core-platform
spec:
  selector:
    app.kubernetes.io/name: knowledge-core-etcd
  ports:
    - {name: client, port: 2379, targetPort: client}
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-core-minio
  namespace: knowledge-core-platform
spec:
  selector:
    app.kubernetes.io/name: knowledge-core-minio
  ports:
    - {name: api, port: 9000, targetPort: api}
    - {name: console, port: 9001, targetPort: console}
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-core-clamav
  namespace: knowledge-core-platform
spec:
  selector:
    app.kubernetes.io/name: knowledge-core-clamav
  ports:
    - {name: clamd, port: 3310, targetPort: clamd}
