apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: knowledge-core-platform-default-deny
  namespace: knowledge-core-platform
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: knowledge-core-platform-dns
  namespace: knowledge-core-platform
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: knowledge-core-platform-internal
  namespace: knowledge-core-platform
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: knowledge-core-platform-clients
  namespace: knowledge-core-platform
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [ci, knowledge-core-test, knowledge-core-prod]
      ports:
        - {protocol: TCP, port: 2379}
        - {protocol: TCP, port: 3310}
        - {protocol: TCP, port: 4222}
        - {protocol: TCP, port: 9000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: knowledge-core-clamav-updates
  namespace: knowledge-core-platform
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: knowledge-core-clamav}
  policyTypes: ["Egress"]
  egress:
    - ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: knowledge-core-platform-monitoring
  namespace: knowledge-core-platform
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 8222}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: knowledge-core-postgres-clients
  namespace: postgresql
spec:
  podSelector:
    matchLabels: {app: postgresql}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [harbor, postgresql, config-system, knowledge-core-test, knowledge-core-prod]
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: knowledge-core-redis-clients
  namespace: redis
spec:
  podSelector:
    matchLabels: {app: redis}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [argocd, harbor, redis, knowledge-core-test, knowledge-core-prod]
      ports:
        - {protocol: TCP, port: 6379}
