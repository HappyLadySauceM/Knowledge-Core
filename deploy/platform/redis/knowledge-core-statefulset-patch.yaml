apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-master
  namespace: redis
spec:
  template:
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
          command: ["/bin/sh", "/opt/knowledge-core/redis-entrypoint.sh"]
          volumeMounts:
            - name: knowledge-core-entrypoint
              mountPath: /opt/knowledge-core/redis-entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
      volumes:
        - name: knowledge-core-entrypoint
          configMap:
            name: knowledge-core-redis-entrypoint
            defaultMode: 0555
