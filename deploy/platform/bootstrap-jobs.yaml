apiVersion: batch/v1
kind: Job
metadata:
  name: knowledge-core-minio-bootstrap
  namespace: knowledge-core-platform
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: knowledge-core-platform-bootstrap
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          command: ["/bin/sh", "/scripts/bootstrap-minio.sh"]
          env:
            - {name: MC_CONFIG_DIR, value: /tmp/mc}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: knowledge-core-minio-credentials, key: root-user}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: knowledge-core-minio-credentials, key: root-password}
            - name: KC_TEST_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: knowledge-core-minio-credentials, key: test-access-key}
            - name: KC_TEST_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: knowledge-core-minio-credentials, key: test-secret-key}
            - name: KC_PROD_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: knowledge-core-minio-credentials, key: prod-access-key}
            - name: KC_PROD_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: knowledge-core-minio-credentials, key: prod-secret-key}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: policies, mountPath: /policies, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap:
            name: knowledge-core-minio-bootstrap
            items:
              - {key: bootstrap-minio.sh, path: bootstrap-minio.sh, mode: 0555}
        - name: policies
          configMap:
            name: knowledge-core-minio-bootstrap
            items:
              - {key: test-minio-policy.json, path: test-minio-policy.json}
              - {key: prod-minio-policy.json, path: prod-minio-policy.json}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
