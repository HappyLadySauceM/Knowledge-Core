apiVersion: batch/v1
kind: Job
metadata:
  name: knowledge-core-postgres-bootstrap
  namespace: postgresql
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: knowledge-core-postgres-bootstrap
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
          command: ["/bin/sh", "/scripts/bootstrap-postgres.sh"]
          env:
            - {name: PGHOST, value: postgresql.postgresql.svc.cluster.local}
            - {name: PGUSER, value: harbor}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: postgresql, key: password}
            - name: KC_TEST_IDENTITY_PASSWORD
              valueFrom:
                secretKeyRef: {name: knowledge-core-postgres-roles, key: test-identity-password}
            - name: KC_TEST_KNOWLEDGE_PASSWORD
              valueFrom:
                secretKeyRef: {name: knowledge-core-postgres-roles, key: test-knowledge-password}
            - name: KC_TEST_COLLABORATION_PASSWORD
              valueFrom:
                secretKeyRef: {name: knowledge-core-postgres-roles, key: test-collaboration-password}
            - name: KC_PROD_IDENTITY_PASSWORD
              valueFrom:
                secretKeyRef: {name: knowledge-core-postgres-roles, key: prod-identity-password}
            - name: KC_PROD_KNOWLEDGE_PASSWORD
              valueFrom:
                secretKeyRef: {name: knowledge-core-postgres-roles, key: prod-knowledge-password}
            - name: KC_PROD_COLLABORATION_PASSWORD
              valueFrom:
                secretKeyRef: {name: knowledge-core-postgres-roles, key: prod-collaboration-password}
            - name: NACOS_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: knowledge-core-postgres-roles, key: nacos-password}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: schema, mountPath: /schema, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap:
            name: knowledge-core-postgres-bootstrap
            defaultMode: 0555
        - name: schema
          configMap:
            name: knowledge-core-nacos-schema
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
