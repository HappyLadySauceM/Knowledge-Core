apiVersion: v1
kind: Service
metadata:
  name: knowledge-core-collaboration
  labels:
    app.kubernetes.io/name: knowledge-core-collaboration
    app.kubernetes.io/component: realtime
    app.kubernetes.io/part-of: knowledge-core
    app.kubernetes.io/managed-by: kustomize
spec:
  # RPC clients probe these pods before HTTP readiness; include not-ready endpoints.
  # RPC 客户端会在 HTTP Ready 之前探活，需要把未 Ready 的 Pod 也加入 Endpoints。
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: knowledge-core-collaboration
  ports:
    - name: websocket
      port: 8091
      targetPort: websocket
    - name: rpc
      port: 8883
      targetPort: rpc
    - name: admin
      port: 8084
      targetPort: admin
