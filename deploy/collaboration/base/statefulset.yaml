apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: knowledge-core-collaboration
  labels:
    app.kubernetes.io/name: knowledge-core-collaboration
    app.kubernetes.io/component: realtime
    app.kubernetes.io/part-of: knowledge-core
    app.kubernetes.io/managed-by: kustomize
spec:
  serviceName: knowledge-core-collaboration-headless
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  # k3s 1.36 persists RollingUpdate.partition=0 and drops maxUnavailable unless MaxUnavailableStatefulSet is enabled.
  # k3s 1.36 会持久化 partition=0；未开启 MaxUnavailableStatefulSet 时会丢弃 maxUnavailable。
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: knowledge-core-collaboration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-core-collaboration
        app.kubernetes.io/component: realtime
        app.kubernetes.io/part-of: knowledge-core
        app.kubernetes.io/managed-by: kustomize
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8084"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collaboration
          image: knowledge-core-collaboration
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLABORATION_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: knowledge-core-collaboration-config
            - secretRef:
                name: knowledge-core-collaboration-secrets
          ports:
            - name: websocket
              containerPort: 8091
            - name: rpc
              containerPort: 8883
            - name: admin
              containerPort: 8084
          startupProbe:
            httpGet:
              path: /health/live
              port: admin
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: admin
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nacos-runtime
              mountPath: /var/run/knowledge-core/nacos
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: nacos-runtime
          emptyDir:
            sizeLimit: 32Mi
