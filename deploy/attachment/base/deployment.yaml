apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-core-attachment
  labels:
    app.kubernetes.io/name: knowledge-core-attachment
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: knowledge-core
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: knowledge-core-attachment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-core-attachment
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: knowledge-core
        app.kubernetes.io/managed-by: kustomize
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8085"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: attachment
          image: knowledge-core-attachment
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: knowledge-core-attachment-config
            - secretRef:
                name: knowledge-core-attachment-secrets
          ports:
            - name: rpc
              containerPort: 8884
            - name: admin
              containerPort: 8085
          startupProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nacos-runtime
              mountPath: /var/run/knowledge-core/nacos
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: nacos-runtime
          emptyDir:
            sizeLimit: 32Mi
