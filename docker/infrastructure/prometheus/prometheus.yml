global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: knowledge-core-gateway
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - gateway:8082

  - job_name: knowledge-core-identity
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - identity:8081

  - job_name: knowledge-core-knowledge
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - knowledge:8083
