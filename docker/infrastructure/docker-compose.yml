services:
  postgres:
    image: postgres:16-alpine
    container_name: knowledge-core-postgres
    environment:
      POSTGRES_USER: knowledge_core
      POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD:?KC_POSTGRES_PASSWORD is required}
      POSTGRES_DB: knowledge_core
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_core -d knowledge_core"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - knowledge-core-postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: knowledge-core-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - knowledge-core-redis-data:/data

  nats:
    image: nats:2.11-alpine
    container_name: knowledge-core-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - knowledge-core-nats-data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: knowledge-core-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${KC_MINIO_ACCESS_KEY:?KC_MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${KC_MINIO_SECRET_KEY:?KC_MINIO_SECRET_KEY is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - knowledge-core-minio-data:/data

  clamav:
    image: clamav/clamav:1.4.3
    container_name: knowledge-core-clamav
    ports:
      - "3310:3310"
    volumes:
      - knowledge-core-clamav-data:/var/lib/clamav

  identity:
    build:
      context: ../..
      dockerfile: docker/identity/Dockerfile
    container_name: knowledge-core-identity
    environment:
      IDENTITY_TRACE_ENABLED: "true"
      IDENTITY_TRACE_ENDPOINT: otel-collector:4317
      IDENTITY_TRACE_SAMPLE_RATIO: "1"
      IDENTITY_POSTGRES_HOST: postgres
      IDENTITY_POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD:?KC_POSTGRES_PASSWORD is required}
      IDENTITY_REDIS_ADDRESS: redis:6379
      IDENTITY_AUTH_PRIVATE_KEY: ${KC_AUTH_PRIVATE_KEY:?KC_AUTH_PRIVATE_KEY is required}
      IDENTITY_AUTH_PUBLIC_KEY: ${KC_AUTH_PUBLIC_KEY:?KC_AUTH_PUBLIC_KEY is required}
      IDENTITY_SMTP_HOST: ${KC_SMTP_HOST:-}
      IDENTITY_SMTP_PORT: ${KC_SMTP_PORT:-587}
      IDENTITY_SMTP_USERNAME: ${KC_SMTP_USERNAME:-}
      IDENTITY_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:-}
      IDENTITY_SMTP_FROM: ${KC_SMTP_FROM:-Knowledge Core <knowledge-core@localhost>}
      IDENTITY_SMTP_FRONTEND_BASE_URL: ${KC_SMTP_FRONTEND_BASE_URL:-http://localhost:3000}
      IDENTITY_AUTH_ACTION_TOKEN_PEPPER: ${KC_AUTH_ACTION_TOKEN_PEPPER:-}
      IDENTITY_AUTH_REFRESH_TOKEN_PEPPER: ${KC_AUTH_REFRESH_TOKEN_PEPPER:-}
      IDENTITY_AUTH_REFRESH_TOKEN_ENCRYPTION_KEY: ${KC_AUTH_REFRESH_TOKEN_ENCRYPTION_KEY:-}
      IDENTITY_AUTH_EMAIL_ENCRYPTION_KEY: ${KC_AUTH_EMAIL_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
      - "8881:8881"
    restart: unless-stopped

  knowledge:
    build:
      context: ../..
      dockerfile: docker/knowledge/Dockerfile
    container_name: knowledge-core-knowledge
    environment:
      KNOWLEDGE_TRACE_ENABLED: "true"
      KNOWLEDGE_TRACE_ENDPOINT: otel-collector:4317
      KNOWLEDGE_TRACE_SAMPLE_RATIO: "1"
      KNOWLEDGE_POSTGRES_HOST: postgres
      KNOWLEDGE_POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD:?KC_POSTGRES_PASSWORD is required}
      KNOWLEDGE_IDENTITY_RPC_ADDRESS: identity:8881
      KNOWLEDGE_COLLABORATION_RPC_ADDRESS: collaboration:8883
      KNOWLEDGE_NATS_SERVERS: nats://nats:4222
      KNOWLEDGE_AUTH_PUBLIC_KEY: ${KC_AUTH_PUBLIC_KEY:?KC_AUTH_PUBLIC_KEY is required}
      KNOWLEDGE_OBJECT_STORAGE_ENDPOINT: minio:9000
      KNOWLEDGE_OBJECT_STORAGE_ACCESS_KEY: ${KC_MINIO_ACCESS_KEY:?KC_MINIO_ACCESS_KEY is required}
      KNOWLEDGE_OBJECT_STORAGE_SECRET_KEY: ${KC_MINIO_SECRET_KEY:?KC_MINIO_SECRET_KEY is required}
      KNOWLEDGE_SCANNER_ADDRESS: clamav:3310
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      identity:
        condition: service_started
      minio:
        condition: service_started
      clamav:
        condition: service_started
    ports:
      - "8083:8083"
      - "8882:8882"
    restart: unless-stopped

  collaboration:
    build:
      context: ../..
      dockerfile: docker/collaboration/Dockerfile
    container_name: knowledge-core-collaboration
    environment:
      COLLABORATION_ENVIRONMENT: development
      COLLABORATION_INSTANCE_ID: collaboration-compose
      COLLABORATION_PUBLIC_ADDRESS: 0.0.0.0:8091
      COLLABORATION_ALLOWED_ORIGINS: ${KC_ALLOWED_ORIGIN:-http://localhost:3000}
      COLLABORATION_RPC_ADDRESS: 0.0.0.0:8883
      COLLABORATION_ADMIN_ADDRESS: 0.0.0.0:8084
      COLLABORATION_POSTGRES_URL: ${KC_COLLABORATION_POSTGRES_URL:?KC_COLLABORATION_POSTGRES_URL is required}
      COLLABORATION_REDIS_URL: redis://redis:6379/1
      COLLABORATION_NATS_SERVERS: nats://nats:4222
      COLLABORATION_NATS_STREAM: KNOWLEDGE_CORE_EVENTS
      COLLABORATION_NATS_PERMISSION_STREAM: KNOWLEDGE_CORE_PERMISSIONS
      COLLABORATION_KNOWLEDGE_SERVICE_NAME: knowledge-core.knowledge
      COLLABORATION_KNOWLEDGE_ADDRESS: knowledge:8882
      COLLABORATION_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      knowledge:
        condition: service_started
    ports:
      - "8091:8091"
      - "8883:8883"
      - "8084:8084"
    restart: unless-stopped

  platform:
    build:
      context: ../..
      dockerfile: docker/platform/Dockerfile
    container_name: knowledge-core-platform
    environment:
      PLATFORM_TRACE_ENABLED: "true"
      PLATFORM_TRACE_ENDPOINT: otel-collector:4317
      PLATFORM_TRACE_SAMPLE_RATIO: "1"
      PLATFORM_POSTGRES_HOST: postgres
      PLATFORM_POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD:?KC_POSTGRES_PASSWORD is required}
      PLATFORM_NATS_SERVERS: nats://nats:4222
      PLATFORM_AUTH_PUBLIC_KEY: ${KC_AUTH_PUBLIC_KEY:?KC_AUTH_PUBLIC_KEY is required}
      PLATFORM_ENCRYPTION_KEY_ID: ${KC_CONFIG_KEY_ID:-config-2026-08}
      PLATFORM_ENCRYPTION_KEK: ${KC_CONFIG_KEK:?KC_CONFIG_KEK is required}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "8086:8086"
      - "8885:8885"
    restart: unless-stopped

  gateway:
    build:
      context: ../..
      dockerfile: docker/gateway/Dockerfile
    container_name: knowledge-core-gateway
    environment:
      GATEWAY_TRACE_ENABLED: "true"
      GATEWAY_TRACE_ENDPOINT: otel-collector:4317
      GATEWAY_TRACE_SAMPLE_RATIO: "1"
      GATEWAY_REDIS_ADDRESS: redis:6379
      GATEWAY_IDENTITY_RPC_ADDRESS: identity:8881
      GATEWAY_KNOWLEDGE_RPC_ADDRESS: knowledge:8882
      GATEWAY_COLLABORATION_RPC_ADDRESS: collaboration:8883
      GATEWAY_PLATFORM_RPC_ADDRESS: platform:8885
      GATEWAY_AUTH_PUBLIC_KEY: ${KC_AUTH_PUBLIC_KEY:?KC_AUTH_PUBLIC_KEY is required}
      GATEWAY_ENDPOINTS_PUBLIC_BASE_URL: http://localhost:8080
      GATEWAY_ENDPOINTS_COLLABORATION_WEBSOCKET_BASE_URL: ws://localhost:8091
      GATEWAY_CORS_ALLOWED_ORIGINS: ${KC_ALLOWED_ORIGIN:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
      identity:
        condition: service_started
      knowledge:
        condition: service_started
      collaboration:
        condition: service_started
      platform:
        condition: service_started
    ports:
      - "8080:8080"
      - "8082:8082"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: knowledge-core-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - knowledge-core-prometheus-data:/prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    container_name: knowledge-core-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      tempo:
        condition: service_started
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    container_name: knowledge-core-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - knowledge-core-tempo-data:/var/tempo
    restart: unless-stopped

volumes:
  knowledge-core-postgres-data:
  knowledge-core-redis-data:
  knowledge-core-nats-data:
  knowledge-core-minio-data:
  knowledge-core-clamav-data:
  knowledge-core-prometheus-data:
  knowledge-core-tempo-data:
