services:
  postgres:
    image: postgres:16-alpine
    container_name: knowledge-core-postgres
    environment:
      POSTGRES_USER: knowledge_core
      POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD:?KC_POSTGRES_PASSWORD is required}
      POSTGRES_DB: knowledge_core
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_core -d knowledge_core"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - knowledge-core-postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: knowledge-core-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - knowledge-core-redis-data:/data

  nats:
    image: nats:2.11-alpine
    container_name: knowledge-core-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - knowledge-core-nats-data:/data

  etcd:
    image: quay.io/coreos/etcd:v3.6.0
    container_name: knowledge-core-etcd
    command:
      - /usr/local/bin/etcd
      - --name=knowledge-core-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - knowledge-core-etcd-data:/etcd-data

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: knowledge-core-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - knowledge-core-prometheus-data:/prometheus

volumes:
  knowledge-core-postgres-data:
  knowledge-core-redis-data:
  knowledge-core-nats-data:
  knowledge-core-etcd-data:
  knowledge-core-prometheus-data:
