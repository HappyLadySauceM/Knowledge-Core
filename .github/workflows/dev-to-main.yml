name: Manual CI Fallback

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Git revision to verify without promotion
        required: true
        default: dev
        type: string

permissions:
  contents: read

concurrency:
  group: manual-ci-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on:
      group: Knowledge-Core CI
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      DOCKER_HOST: unix:///run/user/997/docker.sock
      GOPROXY: https://goproxy.cn,direct
    steps:
      - name: Check out requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          clean: true
          persist-credentials: false

      - name: Run containerized verification
        shell: bash
        env:
          KC_CI_CACHE_ROOT: ${{ runner.tool_cache }}/knowledge-core/container-cache
          KC_CONTAINER_PROXY: http://10.0.2.2:10991
        run: bash .github/ci/run.sh

      - name: Clean persistent workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$GITHUB_WORKSPACE/.git" ]]; then
            echo "Workspace was not checked out; nothing to clean."
            exit 0
          fi
          cd "$GITHUB_WORKSPACE"
          workspace="$(pwd -P)"
          repository_root="$(cd "$(git rev-parse --show-toplevel)" && pwd -P)"
          if [[ "$workspace" != "$repository_root" || "$workspace" != "$(cd "$GITHUB_WORKSPACE" && pwd -P)" ]]; then
            echo "::error title=Unsafe cleanup target::Refusing to clean outside GITHUB_WORKSPACE."
            exit 1
          fi
          git reset --hard HEAD
          git clean -ffdx
