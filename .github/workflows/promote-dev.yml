name: Promote Dev

on:
  workflow_run:
    workflows: [Dev CI]
    branches: [dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful Dev CI run ID to resume idempotently
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: knowledge-core-promote-dev
  cancel-in-progress: false

jobs:
  promote:
    name: deploy, smoke and release
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    environment: release
    runs-on:
      group: Knowledge-Core CI
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 35
    env:
      DOCKER_HOST: unix:///run/user/997/docker.sock
      GITHUB_REPOSITORY: ${{ github.repository }}
      IMAGE_REGISTRY: harbor.happyladysauce.local
      IMAGE_NAMESPACE: knowledge-core
      GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY }}
      HTTP_PROXY: ${{ vars.KC_CONTAINER_PROXY }}
      HTTPS_PROXY: ${{ vars.KC_CONTAINER_PROXY }}
      NO_PROXY: ${{ vars.KC_NO_PROXY }}
      GITHUB_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out trusted control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          clean: true
          persist-credentials: false

      - name: Build cached control image
        id: control
        shell: bash
        run: |
          set -euo pipefail
          key="$(sha256sum "$GITHUB_WORKSPACE/control/.github/ci/ControlDockerfile" | awk '{print substr($1,1,16)}')"
          image="knowledge-core-control:${key}"
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            docker build \
              --build-arg "HTTP_PROXY=$HTTP_PROXY" \
              --build-arg "HTTPS_PROXY=$HTTPS_PROXY" \
              --build-arg "NO_PROXY=$NO_PROXY" \
              --file "$GITHUB_WORKSPACE/control/.github/ci/ControlDockerfile" \
              --label "knowledge-core.control-image-key=${key}" \
              --tag "$image" \
              "$GITHUB_WORKSPACE/control/.github/ci"
          fi
          echo "image=$image" >>"$GITHUB_OUTPUT"

      - name: Resolve and validate successful Dev CI run
        id: candidate
        shell: bash
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          OUTPUT_ROOT: ${{ runner.temp }}/knowledge-core-run
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/control/scripts/ci/resolve-ci-run.sh"
          echo "sha=$(<"$OUTPUT_ROOT/candidate-sha")" >>"$GITHUB_OUTPUT"
          echo "run_id=$(<"$OUTPUT_ROOT/ci-run-id")" >>"$GITHUB_OUTPUT"

      - name: Check out tested candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          path: candidate
          clean: true
          persist-credentials: false

      - name: Prepare ephemeral release credentials
        shell: bash
        env:
          HARBOR_DOCKER_CONFIG_JSON: ${{ secrets.HARBOR_DOCKER_CONFIG_JSON }}
          HARBOR_CA_PEM: ${{ secrets.HARBOR_CA_PEM }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          K3S_RELEASE_KUBECONFIG: ${{ secrets.K3S_RELEASE_KUBECONFIG }}
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/knowledge-core-secrets"
          install -d "$root/harbor" "$RUNNER_TEMP/knowledge-core-release"
          printf '%s' "$HARBOR_DOCKER_CONFIG_JSON" >"$root/harbor/config.json"
          printf '%s' "$HARBOR_CA_PEM" >"$root/harbor/ca.crt"
          printf '%s' "$GH_APP_PRIVATE_KEY" >"$root/github-app.pem"
          printf '%s' "$COSIGN_PRIVATE_KEY" >"$root/cosign.key"
          printf '%s' "$COSIGN_PUBLIC_KEY" >"$root/cosign.pub"
          printf '%s' "$K3S_RELEASE_KUBECONFIG" >"$root/kubeconfig"
          for file in "$root/harbor/config.json" "$root/harbor/ca.crt" \
            "$root/github-app.pem" "$root/cosign.key" "$root/cosign.pub" "$root/kubeconfig"; do
            test -s "$file"
          done

      - name: Mint short-lived GitHub App token
        id: app
        shell: bash
        env:
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY_FILE: ${{ runner.temp }}/knowledge-core-secrets/github-app.pem
        run: |
          set -euo pipefail
          token="$(bash "$GITHUB_WORKSPACE/control/scripts/ci/github-app-token.sh")"
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"

      - name: Mark dev deployment pending
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_SHA: ${{ steps.candidate.outputs.sha }}
        run: >-
          bash "$GITHUB_WORKSPACE/control/scripts/ci/github-status.sh"
          pending 'Knowledge Core dev deployment started' knowledge-core/smoke

      - name: Resolve candidate image digests from Harbor
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/knowledge-core-secrets/harbor
          HARBOR_CA_FILE: ${{ runner.temp }}/knowledge-core-secrets/harbor/ca.crt
          GITHUB_SHA: ${{ steps.candidate.outputs.sha }}
          OUTPUT_ROOT: ${{ runner.temp }}/knowledge-core-release
        run: bash "$GITHUB_WORKSPACE/control/scripts/ci/resolve-images.sh"

      - name: Promote immutable digests to GitOps
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --read-only \
            --network bridge \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=268435456 \
            --env "GITHUB_TOKEN=$GITHUB_TOKEN" \
            --env "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" \
            --env "GITHUB_SHA=$GITHUB_SHA" \
            --env GITHUB_REF=refs/heads/dev \
            --env "GITOPS_REPOSITORY=$GITOPS_REPOSITORY" \
            --env SOURCE_ROOT=/candidate \
            --env IMAGE_MAP_FILE=/release/images.env \
            --env OUTPUT_ROOT=/release \
            --env ALLOW_RELEASE_RECOVERY=true \
            --env "HTTP_PROXY=$HTTP_PROXY" \
            --env "HTTPS_PROXY=$HTTPS_PROXY" \
            --env "NO_PROXY=$NO_PROXY" \
            --volume "$GITHUB_WORKSPACE/control:/control:ro" \
            --volume "$GITHUB_WORKSPACE/candidate:/candidate:ro" \
            --volume "$RUNNER_TEMP/knowledge-core-release:/release:rw" \
            "${{ steps.control.outputs.image }}" \
            /control/scripts/ci/promote-gitops.sh

      - name: Wait for Argo CD deployment
        shell: bash
        run: |
          set -euo pipefail
          revision="$(<"$RUNNER_TEMP/knowledge-core-release/gitops-revision")"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --read-only \
            --network bridge \
            --tmpfs /tmp:rw,nosuid,nodev,size=67108864 \
            --env KUBECONFIG=/secrets/kubeconfig \
            --env "GITOPS_REVISION=$revision" \
            --env IMAGE_MAP_FILE=/release/images.env \
            --env "HTTP_PROXY=$HTTP_PROXY" \
            --env "HTTPS_PROXY=$HTTPS_PROXY" \
            --env "NO_PROXY=$NO_PROXY" \
            --volume "$GITHUB_WORKSPACE/control:/control:ro" \
            --volume "$RUNNER_TEMP/knowledge-core-release:/release:ro" \
            --volume "$RUNNER_TEMP/knowledge-core-secrets/kubeconfig:/secrets/kubeconfig:ro" \
            "${{ steps.control.outputs.image }}" \
            /control/scripts/ci/wait-gitops.sh

      - name: Smoke test deployed dev services
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --read-only \
            --network bridge \
            --tmpfs /tmp:rw,nosuid,nodev,size=67108864 \
            --env KUBECONFIG=/secrets/kubeconfig \
            --env "HTTP_PROXY=$HTTP_PROXY" \
            --env "HTTPS_PROXY=$HTTPS_PROXY" \
            --env "NO_PROXY=$NO_PROXY" \
            --volume "$GITHUB_WORKSPACE/control:/control:ro" \
            --volume "$RUNNER_TEMP/knowledge-core-secrets/kubeconfig:/secrets/kubeconfig:ro" \
            "${{ steps.control.outputs.image }}" \
            /control/scripts/ci/smoke-dev.sh

      - name: Sign and verify immutable images
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/knowledge-core-secrets/harbor
          HARBOR_CA_FILE: ${{ runner.temp }}/knowledge-core-secrets/harbor/ca.crt
          IMAGE_MAP_FILE: ${{ runner.temp }}/knowledge-core-release/images.env
          COSIGN_PRIVATE_KEY_FILE: ${{ runner.temp }}/knowledge-core-secrets/cosign.key
          COSIGN_PUBLIC_KEY_FILE: ${{ runner.temp }}/knowledge-core-secrets/cosign.pub
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: bash "$GITHUB_WORKSPACE/control/scripts/ci/sign-images.sh"

      - name: Mark smoke status successful
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_SHA: ${{ steps.candidate.outputs.sha }}
        run: >-
          bash "$GITHUB_WORKSPACE/control/scripts/ci/github-status.sh"
          success 'Knowledge Core dev smoke passed' knowledge-core/smoke

      - name: Fast-forward main and select release version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_SHA: ${{ steps.candidate.outputs.sha }}
          GITHUB_REF: refs/heads/dev
          SOURCE_ROOT: ${{ github.workspace }}/candidate
          OUTPUT_ROOT: ${{ runner.temp }}/knowledge-core-release
          ALLOW_RELEASE_RECOVERY: "true"
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/control/scripts/ci/promote-main.sh"
          touch "$RUNNER_TEMP/knowledge-core-release/main-promoted"

      - name: Add immutable release tags in Harbor
        shell: bash
        env:
          IMAGE_MAP_FILE: ${{ runner.temp }}/knowledge-core-release/images.env
          VERSION_FILE: ${{ runner.temp }}/knowledge-core-release/version
          DOCKER_CONFIG: ${{ runner.temp }}/knowledge-core-secrets/harbor
          HARBOR_CA_FILE: ${{ runner.temp }}/knowledge-core-secrets/harbor/ca.crt
        run: bash "$GITHUB_WORKSPACE/control/scripts/ci/tag-release-images.sh"

      - name: Publish Git tag and GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_SHA: ${{ steps.candidate.outputs.sha }}
          RELEASE_SHA_FILE: ${{ runner.temp }}/knowledge-core-release/release-sha
          VERSION_FILE: ${{ runner.temp }}/knowledge-core-release/version
        run: bash "$GITHUB_WORKSPACE/control/scripts/ci/publish-release.sh"

      - name: Roll back unpromoted GitOps revision
        if: failure() && steps.app.outputs.token != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/knowledge-core-release"
          if [[ -e "$release/main-promoted" || ! -r "$release/gitops-revision" ]]; then
            exit 0
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --read-only \
            --network bridge \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=268435456 \
            --env "GITHUB_TOKEN=$GITHUB_TOKEN" \
            --env "GITOPS_REPOSITORY=$GITOPS_REPOSITORY" \
            --env "PROMOTED_REVISION=$(<"$release/gitops-revision")" \
            --env "PREVIOUS_REVISION=$(<"$release/gitops-previous-revision")" \
            --env "GITOPS_CHANGED=$(<"$release/gitops-changed")" \
            --env KUBECONFIG=/secrets/kubeconfig \
            --env "HTTP_PROXY=$HTTP_PROXY" \
            --env "HTTPS_PROXY=$HTTPS_PROXY" \
            --env "NO_PROXY=$NO_PROXY" \
            --volume "$GITHUB_WORKSPACE/control:/control:ro" \
            --volume "$RUNNER_TEMP/knowledge-core-secrets/kubeconfig:/secrets/kubeconfig:ro" \
            "${{ steps.control.outputs.image }}" \
            /control/scripts/ci/rollback-gitops.sh

      - name: Mark promotion failed
        if: failure() && steps.app.outputs.token != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_SHA: ${{ steps.candidate.outputs.sha }}
        run: >-
          bash "$GITHUB_WORKSPACE/control/scripts/ci/github-status.sh"
          failure 'Knowledge Core promotion failed' knowledge-core/smoke

      - name: Summarize release
        if: success()
        shell: bash
        run: |
          {
            echo '### Knowledge Core release'
            echo
            echo "- Candidate: \`${{ steps.candidate.outputs.sha }}\`"
            echo "- Version: \`$(<"$RUNNER_TEMP/knowledge-core-release/version")\`"
            echo "- GitOps: \`$(<"$RUNNER_TEMP/knowledge-core-release/gitops-revision")\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral release material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- \
            "$RUNNER_TEMP/knowledge-core-secrets" \
            "$RUNNER_TEMP/knowledge-core-release" \
            "$RUNNER_TEMP/knowledge-core-run"
