name: knowledge-core-pipeline

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  # The runner image contains the versioned ci-templates CLI. Project-specific
  # values live in source control instead of being duplicated in workflow JSON.
  CI_PROJECT_CONFIG: .ci/pipeline.yaml
  BUILD_CPU_PERCENT: "100"
  NODE_USE_ENV_PROXY: "1"
  GO111MODULE: "on"
  GOPROXY: "https://goproxy.cn,direct"
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
  COREPACK_NPM_REGISTRY: "https://registry.npmmirror.com"

# Serialize releases for this project/branch while allowing the matrix jobs in
# one run to consume all available ARC capacity.
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  track-start:
    if: vars.FEISHU_TASK_TRACKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - name: Mark Feishu pipeline task in progress
        uses: HappyLadySauceM/ci-templates/.github/actions/feishu-pipeline-task@0afa6fd5c6a58c2ad4529d02920afeefe2ec039e
        with:
          operation: sync
          phase: in_progress
          app-id: ${{ vars.FEISHU_APP_ID }}
          app-secret: ${{ secrets.FEISHU_APP_SECRET }}
          chat-id: ${{ vars.FEISHU_CHAT_ID }}
          github-custom-attr-id: ${{ vars.FEISHU_GITHUB_ATTR_ID }}
          workflow-name: knowledge-core-pipeline
          github-token: ${{ github.token }}
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}

  plan:
    runs-on: hls-standard
    timeout-minutes: 10
    concurrency:
      group: ${{ github.repository }}-${{ github.workflow }}-plan-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      services: ${{ steps.plan.outputs.services }}
      build_services: ${{ steps.plan.outputs.build_services }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      go_build_matrix: ${{ steps.plan.outputs.go_build_matrix }}
      rust_build_matrix: ${{ steps.plan.outputs.rust_build_matrix }}
      deploy_services: ${{ steps.plan.outputs.deploy_services }}
      release_services: ${{ steps.plan.outputs.release_services }}
      deploy_changed: ${{ steps.plan.outputs.deploy_changed }}
      has_build_changes: ${{ steps.plan.outputs.has_build_changes }}
      has_go_build_changes: ${{ steps.plan.outputs.has_go_build_changes }}
      has_rust_build_changes: ${{ steps.plan.outputs.has_rust_build_changes }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
      rust_required: ${{ steps.plan.outputs.rust_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan affected services
        id: plan
        run: |
          set -euo pipefail
          release_branch="$(python3 - <<'PY'
          import os
          from ci_templates.config import load_config
          print(load_config(os.environ["CI_PROJECT_CONFIG"]).release_branch)
          PY
          )"
          git fetch --no-tags origin "$release_branch"
          base="$(git rev-parse "origin/$release_branch")"
          ci-templates validate --config "$CI_PROJECT_CONFIG"
          changes="$(ci-templates changes --config "$CI_PROJECT_CONFIG" --base "$base" --details-file changes.json)"
          echo "$changes"
          services="$(jq -r '.services | join(",")' <<<"$changes")"
          build_services="$(jq -r '.build_services | join(",")' <<<"$changes")"
          deploy_services="$(jq -r '.deploy_services | join(",")' <<<"$changes")"
          release_services="$(jq -r '.release_services | join(",")' <<<"$changes")"
          deploy_changed="$(jq -r '.deploy_changed' <<<"$changes")"
          build_matrix="$(jq -cn --arg value "$build_services" '$value | split(",") | map(select(length > 0)) | if length == 0 then ["__skip__"] else . end')"
          rust_required="$(BUILD_SERVICES="$build_services" python3 - <<'PY'
          import os
          from ci_templates.config import load_config
          selected = set(filter(None, os.environ["BUILD_SERVICES"].split(",")))
          print(str(any(s.name in selected and s.artifact_group == "rust" for s in load_config(os.environ["CI_PROJECT_CONFIG"]).services)).lower())
          PY
          )"
          go_build_services="$(BUILD_SERVICES="$build_services" python3 - <<'PY'
          import os
          from ci_templates.config import load_config
          selected = set(filter(None, os.environ["BUILD_SERVICES"].split(",")))
          print(",".join(s.name for s in load_config(os.environ["CI_PROJECT_CONFIG"]).services if s.name in selected and s.artifact_group == "go"))
          PY
          )"
          rust_build_services="$(BUILD_SERVICES="$build_services" python3 - <<'PY'
          import os
          from ci_templates.config import load_config
          selected = set(filter(None, os.environ["BUILD_SERVICES"].split(",")))
          print(",".join(s.name for s in load_config(os.environ["CI_PROJECT_CONFIG"]).services if s.name in selected and s.artifact_group == "rust"))
          PY
          )"
          go_build_matrix="$(jq -cn --arg value "$go_build_services" '$value | split(",") | map(select(length > 0)) | if length == 0 then ["__skip__"] else . end')"
          rust_build_matrix="$(jq -cn --arg value "$rust_build_services" '$value | split(",") | map(select(length > 0)) | if length == 0 then ["__skip__"] else . end')"
          has_changes=false
          has_build_changes=false
          has_go_build_changes=false
          has_rust_build_changes=false
          [[ -n "$services" || "$deploy_changed" == true ]] && has_changes=true
          [[ -n "$build_services" ]] && has_build_changes=true
          [[ -n "$go_build_services" ]] && has_go_build_changes=true
          [[ -n "$rust_build_services" ]] && has_rust_build_changes=true
          {
            echo "services=$services"
            echo "build_services=$build_services"
            echo "build_matrix=$build_matrix"
            echo "go_build_matrix=$go_build_matrix"
            echo "rust_build_matrix=$rust_build_matrix"
            echo "deploy_services=$deploy_services"
            echo "release_services=$release_services"
            echo "has_build_changes=$has_build_changes"
            echo "has_go_build_changes=$has_go_build_changes"
            echo "has_rust_build_changes=$has_rust_build_changes"
            echo "has_changes=$has_changes"
            echo "deploy_changed=$deploy_changed"
            echo "rust_required=$rust_required"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Keep names stable within one run so rerun-failed can reuse artifacts
          # produced by jobs that were already successful in an earlier attempt.
          # 在同一 run 内保持名称稳定，让 rerun-failed 可以复用前一次成功作业的产物。
          name: knowledge-core-plan-${{ github.run_id }}
          path: changes.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  deploy-verify:
    needs: plan
    if: needs.plan.outputs.deploy_changed == 'true'
    runs-on: hls-standard
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=mod
    concurrency:
      group: ${{ github.repository }}-${{ github.workflow }}-deploy-verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate deployment overlays and dynamic configuration
        run: |
          set -euo pipefail
          for overlay in deploy/*/overlay/dev; do
            test -d "$overlay"
            kubectl kustomize "$overlay" >/dev/null
          done
          for input in deploy/nacos/*.dynamic.yaml; do
            service="${input##*/}"
            service="${service%.dynamic.yaml}"
            go run ./tools/configctl validate --service "$service" --input "$input"
          done

  go-verify-build:
    needs: plan
    if: needs.plan.outputs.has_build_changes == 'true'
    runs-on: hls-standard
    timeout-minutes: 45
    concurrency:
      group: ${{ github.repository }}-${{ github.workflow }}-go-${{ github.ref }}
      cancel-in-progress: true
    env:
      KC_RUST_GATE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned IDL generators
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TOOL_CACHE/knowledge-core-go-tools"
          install -d -m 0755 "$bin_dir"
          [[ -x "$bin_dir/kitex" ]] || GOBIN="$bin_dir" go install github.com/cloudwego/kitex/tool/cmd/kitex@v0.16.2
          [[ -x "$bin_dir/hz" ]] || GOBIN="$bin_dir" go install github.com/cloudwego/hertz/cmd/hz@v0.9.7
          [[ -x "$bin_dir/thriftgo" ]] || GOBIN="$bin_dir" go install github.com/cloudwego/thriftgo@v0.4.5
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Run Go gates and publish verified binaries
        env:
          BUILD_SERVICES: ${{ needs.plan.outputs.build_services }}
        run: |
          set -euo pipefail
          go_services="$(BUILD_SERVICES="$BUILD_SERVICES" python3 - <<'PY'
          import os
          from ci_templates.config import load_config
          selected = set(filter(None, os.environ["BUILD_SERVICES"].split(",")))
          print(" ".join(s.name for s in load_config(os.environ["CI_PROJECT_CONFIG"]).services if s.name in selected and s.artifact_group == "go"))
          PY
          )"
          make go-ci generate-go-check KC_RUST_GATE=0
          rm -rf .ci-artifacts
          mkdir -p .ci-artifacts
          if [[ -n "$go_services" ]]; then
            make go-release GO_RELEASE_SERVICES="$go_services" GO_ARTIFACT_DIR=.ci-artifacts KC_RUST_GATE=0
          fi
          printf 'verified-go\n' > .ci-artifacts/artifact-marker-go.txt
      - if: contains(fromJSON(needs.plan.outputs.go_build_matrix), 'gateway')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-core-binary-gateway-${{ github.run_id }}
          path: .ci-artifacts/gateway
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - if: contains(fromJSON(needs.plan.outputs.go_build_matrix), 'identity')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-core-binary-identity-${{ github.run_id }}
          path: .ci-artifacts/identity
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - if: contains(fromJSON(needs.plan.outputs.go_build_matrix), 'knowledge')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-core-binary-knowledge-${{ github.run_id }}
          path: .ci-artifacts/knowledge
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - if: contains(fromJSON(needs.plan.outputs.go_build_matrix), 'attachment')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-core-binary-attachment-${{ github.run_id }}
          path: .ci-artifacts/attachment
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - if: contains(fromJSON(needs.plan.outputs.go_build_matrix), 'platform')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-core-binary-platform-${{ github.run_id }}
          path: .ci-artifacts/platform
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  rust-verify-build:
    # Go and Rust quality gates are independent. Their package jobs fan out
    # independently too, so Go image packaging does not wait for Rust release.
    needs: plan
    if: needs.plan.outputs.has_build_changes == 'true' && needs.plan.outputs.rust_required == 'true'
    runs-on: hls-standard
    timeout-minutes: 50
    concurrency:
      group: ${{ github.repository }}-${{ github.workflow }}-rust-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Check pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain list | grep -Eq '^1.97.1-' || { echo 'Rust 1.97.1 is not installed in the runner image' >&2; exit 1; }
          rustup component list --toolchain 1.97.1 | grep -Eq '^clippy-.* \(installed\)$'
          rustup component list --toolchain 1.97.1 | grep -Eq '^rustfmt-.* \(installed\)$'
          echo "RUSTUP_TOOLCHAIN=1.97.1" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/knowledge-core-cargo-target" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@583939ec0c8ee9c523cc60342d3d979ce6730f38
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          mirror: https://cdn.npmmirror.com/binaries/node
      - name: Run Rust and interoperability gates and publish binary
        run: |
          set -euo pipefail
          make rust-ci generate-rust-check
          rm -rf .ci-artifacts
          mkdir -p .ci-artifacts
          make rust-release RUST_ARTIFACT_DIR=.ci-artifacts
          printf 'verified-rust\n' > .ci-artifacts/artifact-marker-rust.txt
          npm --prefix services/collaboration/interop ci
          npm --prefix services/collaboration/interop run ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-core-binary-collaboration-${{ github.run_id }}
          path: .ci-artifacts/collaboration
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  release-notes:
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: hls-standard
    timeout-minutes: 10
    environment: release
    concurrency:
      group: ${{ github.repository }}-${{ github.workflow }}-release-notes-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: knowledge-core-plan-${{ github.run_id }}
      - name: Generate one release summary
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERVICES: ${{ needs.plan.outputs.release_services }}
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}" || { echo 'DEEPSEEK_API_KEY is required' >&2; exit 1; }
          ci-templates summarize --config "$CI_PROJECT_CONFIG" --services "$SERVICES" --changes-file changes.json --output release.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-core-release-notes-${{ github.run_id }}
          path: release.md
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  prewarm-base-images:
    needs: [plan]
    if: needs.plan.outputs.has_build_changes == 'true'
    runs-on: hls-builder
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Prepare Harbor credentials
        env:
          HARBOR_DOCKER_CONFIG_JSON: ${{ secrets.HARBOR_DOCKER_CONFIG_JSON }}
          HARBOR_CA_PEM: ${{ secrets.HARBOR_CA_PEM }}
        run: |
          set -euo pipefail
          umask 077
          install -d "$RUNNER_TEMP/harbor"
          printf '%s' "$HARBOR_DOCKER_CONFIG_JSON" > "$RUNNER_TEMP/harbor/config.json"
          printf '%s' "$HARBOR_CA_PEM" > "$RUNNER_TEMP/harbor/ca.crt"
          test -s "$RUNNER_TEMP/harbor/config.json" && test -s "$RUNNER_TEMP/harbor/ca.crt"
          if [[ -s /etc/ssl/certs/ca-certificates.crt ]]; then
            cat /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/harbor/ca.crt" > "$RUNNER_TEMP/harbor/ca-bundle.crt"
          else
            cp "$RUNNER_TEMP/harbor/ca.crt" "$RUNNER_TEMP/harbor/ca-bundle.crt"
          fi
          echo "DOCKER_CONFIG=$RUNNER_TEMP/harbor" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=$RUNNER_TEMP/harbor/ca-bundle.crt" >> "$GITHUB_ENV"
          echo "CI_REGISTRY_CA_FILE=$RUNNER_TEMP/harbor/ca.crt" >> "$GITHUB_ENV"
      - name: Verify BuildKit and prewarm configured base images
        run: |
          set -euo pipefail
          docker info >/dev/null
          ci-templates prewarm --config "$CI_PROJECT_CONFIG" --repo .

  package-go-candidates:
    needs: [plan, go-verify-build, prewarm-base-images]
    if: always() && needs.plan.outputs.has_go_build_changes == 'true' && needs.go-verify-build.result == 'success' && needs.prewarm-base-images.result == 'success'
    runs-on: hls-builder
    timeout-minutes: 30
    environment: release
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.go_build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: knowledge-core-binary-${{ matrix.service }}-${{ github.run_id }}
          path: .ci-artifacts
      - name: Prepare Harbor credentials
        env:
          HARBOR_DOCKER_CONFIG_JSON: ${{ secrets.HARBOR_DOCKER_CONFIG_JSON }}
          HARBOR_CA_PEM: ${{ secrets.HARBOR_CA_PEM }}
        run: |
          set -euo pipefail
          umask 077
          install -d "$RUNNER_TEMP/harbor"
          printf '%s' "$HARBOR_DOCKER_CONFIG_JSON" > "$RUNNER_TEMP/harbor/config.json"
          printf '%s' "$HARBOR_CA_PEM" > "$RUNNER_TEMP/harbor/ca.crt"
          test -s "$RUNNER_TEMP/harbor/config.json" && test -s "$RUNNER_TEMP/harbor/ca.crt"
          if [[ -s /etc/ssl/certs/ca-certificates.crt ]]; then
            cat /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/harbor/ca.crt" > "$RUNNER_TEMP/harbor/ca-bundle.crt"
          else
            cp "$RUNNER_TEMP/harbor/ca.crt" "$RUNNER_TEMP/harbor/ca-bundle.crt"
          fi
          echo "DOCKER_CONFIG=$RUNNER_TEMP/harbor" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=$RUNNER_TEMP/harbor/ca-bundle.crt" >> "$GITHUB_ENV"
          echo "CI_REGISTRY_CA_FILE=$RUNNER_TEMP/harbor/ca.crt" >> "$GITHUB_ENV"
      - name: Build immutable candidate
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          test "$SERVICE" != __skip__
          test -f ".ci-artifacts/$SERVICE"
          chmod 0755 ".ci-artifacts/$SERVICE"
          digest="$(sha256sum ".ci-artifacts/$SERVICE" | awk '{print $1}')"
          jq -n --arg service "$SERVICE" --arg path ".ci-artifacts/$SERVICE" --arg digest "$digest" \
            '{source_sha:env.GITHUB_SHA,services:{($service):{path:$path,sha256:$digest}}}' > .ci-artifact-manifest.json
          candidate_tag="$(python3 - <<'PY'
          import os
          from ci_templates.config import load_config
          print(load_config(os.environ["CI_PROJECT_CONFIG"]).candidate_tag_template.format(sha=os.environ["GITHUB_SHA"]))
          PY
          )"
          result="$(ci-templates build --config "$CI_PROJECT_CONFIG" --service "$SERVICE" --tag "$candidate_tag" --preserve-previous --reuse-existing --artifact-manifest .ci-artifact-manifest.json)"
          echo "$result"
          jq -e '.digest | strings | test("^sha256:[0-9a-f]{64}$")' <<<"$result" >/dev/null
          jq --arg source_sha "$GITHUB_SHA" --arg candidate_tag "$candidate_tag" \
            '. + {source_sha:$source_sha,candidate_tag:$candidate_tag}' <<<"$result" > "candidate-$SERVICE.json"
          jq -e '.kustomize_name and .image and .digest' "candidate-$SERVICE.json" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-core-candidate-${{ matrix.service }}-${{ github.run_id }}
          path: candidate-${{ matrix.service }}.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  package-rust-candidates:
    needs: [plan, rust-verify-build, prewarm-base-images]
    if: always() && needs.plan.outputs.has_rust_build_changes == 'true' && needs.rust-verify-build.result == 'success' && needs.prewarm-base-images.result == 'success'
    runs-on: hls-builder
    timeout-minutes: 30
    environment: release
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.rust_build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: knowledge-core-binary-${{ matrix.service }}-${{ github.run_id }}
          path: .ci-artifacts
      - name: Prepare Harbor credentials
        env:
          HARBOR_DOCKER_CONFIG_JSON: ${{ secrets.HARBOR_DOCKER_CONFIG_JSON }}
          HARBOR_CA_PEM: ${{ secrets.HARBOR_CA_PEM }}
        run: |
          set -euo pipefail
          umask 077
          install -d "$RUNNER_TEMP/harbor"
          printf '%s' "$HARBOR_DOCKER_CONFIG_JSON" > "$RUNNER_TEMP/harbor/config.json"
          printf '%s' "$HARBOR_CA_PEM" > "$RUNNER_TEMP/harbor/ca.crt"
          test -s "$RUNNER_TEMP/harbor/config.json" && test -s "$RUNNER_TEMP/harbor/ca.crt"
          if [[ -s /etc/ssl/certs/ca-certificates.crt ]]; then
            cat /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/harbor/ca.crt" > "$RUNNER_TEMP/harbor/ca-bundle.crt"
          else
            cp "$RUNNER_TEMP/harbor/ca.crt" "$RUNNER_TEMP/harbor/ca-bundle.crt"
          fi
          echo "DOCKER_CONFIG=$RUNNER_TEMP/harbor" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=$RUNNER_TEMP/harbor/ca-bundle.crt" >> "$GITHUB_ENV"
          echo "CI_REGISTRY_CA_FILE=$RUNNER_TEMP/harbor/ca.crt" >> "$GITHUB_ENV"
      - name: Build immutable candidate
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          test "$SERVICE" != __skip__
          test -f ".ci-artifacts/$SERVICE"
          chmod 0755 ".ci-artifacts/$SERVICE"
          digest="$(sha256sum ".ci-artifacts/$SERVICE" | awk '{print $1}')"
          jq -n --arg service "$SERVICE" --arg path ".ci-artifacts/$SERVICE" --arg digest "$digest" \
            '{source_sha:env.GITHUB_SHA,services:{($service):{path:$path,sha256:$digest}}}' > .ci-artifact-manifest.json
          candidate_tag="$(python3 - <<'PY'
          import os
          from ci_templates.config import load_config
          print(load_config(os.environ["CI_PROJECT_CONFIG"]).candidate_tag_template.format(sha=os.environ["GITHUB_SHA"]))
          PY
          )"
          result="$(ci-templates build --config "$CI_PROJECT_CONFIG" --service "$SERVICE" --tag "$candidate_tag" --preserve-previous --reuse-existing --artifact-manifest .ci-artifact-manifest.json)"
          echo "$result"
          jq -e '.digest | strings | test("^sha256:[0-9a-f]{64}$")' <<<"$result" >/dev/null
          jq --arg source_sha "$GITHUB_SHA" --arg candidate_tag "$candidate_tag" \
            '. + {source_sha:$source_sha,candidate_tag:$candidate_tag}' <<<"$result" > "candidate-$SERVICE.json"
          jq -e '.kustomize_name and .image and .digest' "candidate-$SERVICE.json" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-core-candidate-${{ matrix.service }}-${{ github.run_id }}
          path: candidate-${{ matrix.service }}.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  deploy-release:
    needs: [plan, deploy-verify, package-go-candidates, package-rust-candidates, release-notes]
    if: always() && needs.plan.outputs.has_changes == 'true' && (needs.deploy-verify.result == 'success' || needs.plan.outputs.deploy_changed == 'false') && needs.release-notes.result == 'success' && (needs.plan.outputs.has_go_build_changes != 'true' || needs.package-go-candidates.result == 'success') && (needs.plan.outputs.has_rust_build_changes != 'true' || needs.package-rust-candidates.result == 'success')
    runs-on: hls-standard
    timeout-minutes: 45
    environment: release
    concurrency:
      group: ${{ github.repository }}-${{ github.workflow }}-deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      statuses: write
    outputs:
      smoke_ok: ${{ steps.smoke.outputs.ok }}
      candidates_promoted: ${{ steps.promote.outputs.ok }}
      release_tag: ${{ steps.promote.outputs.release_tag }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        env:
          NODE_USE_ENV_PROXY: "1"
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},deploy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fast-forwarding main needs origin/main as an ancestor of HEAD.
          # 快进 main 需要 origin/main 是 HEAD 的祖先。
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: knowledge-core-plan-${{ github.run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: knowledge-core-release-notes-${{ github.run_id }}
      - if: needs.plan.outputs.has_build_changes == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: knowledge-core-candidate-*-${{ github.run_id }}
          path: .candidates
          merge-multiple: true
      - name: Prepare deployment credentials
        env:
          HARBOR_DOCKER_CONFIG_JSON: ${{ secrets.HARBOR_DOCKER_CONFIG_JSON }}
          HARBOR_CA_PEM: ${{ secrets.HARBOR_CA_PEM }}
          K3S_RELEASE_KUBECONFIG: ${{ secrets.K3S_RELEASE_KUBECONFIG }}
        run: |
          set -euo pipefail
          umask 077
          install -d "$RUNNER_TEMP/release"
          printf '%s' "$HARBOR_DOCKER_CONFIG_JSON" > "$RUNNER_TEMP/release/config.json"
          printf '%s' "$HARBOR_CA_PEM" > "$RUNNER_TEMP/release/ca.crt"
          printf '%s' "$K3S_RELEASE_KUBECONFIG" > "$RUNNER_TEMP/release/kubeconfig"
          test -s "$RUNNER_TEMP/release/config.json" && test -s "$RUNNER_TEMP/release/ca.crt" && test -s "$RUNNER_TEMP/release/kubeconfig"
          api_server="$(kubectl config --kubeconfig "$RUNNER_TEMP/release/kubeconfig" view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          test "$api_server" = "https://kubernetes.default.svc:443" || {
            echo "release kubeconfig must use the cluster-internal Kubernetes service, got: $api_server" >&2
            exit 1
          }
          kubectl --kubeconfig "$RUNNER_TEMP/release/kubeconfig" version --request-timeout=10s
          kubectl --kubeconfig "$RUNNER_TEMP/release/kubeconfig" auth can-i update applicationsets.argoproj.io/knowledge-core-services-dev -n argocd | grep -qx yes
          kubectl --kubeconfig "$RUNNER_TEMP/release/kubeconfig" auth can-i update applications.argoproj.io/knowledge-core-gateway-dev -n argocd | grep -qx yes
          kubectl --kubeconfig "$RUNNER_TEMP/release/kubeconfig" auth can-i get services/knowledge-core-gateway -n knowledge-core-dev | grep -qx yes
          if [[ -s /etc/ssl/certs/ca-certificates.crt ]]; then
            cat /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/release/ca.crt" > "$RUNNER_TEMP/release/ca-bundle.crt"
          else
            cp "$RUNNER_TEMP/release/ca.crt" "$RUNNER_TEMP/release/ca-bundle.crt"
          fi
          echo "DOCKER_CONFIG=$RUNNER_TEMP/release" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=$RUNNER_TEMP/release/ca-bundle.crt" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$RUNNER_TEMP/release/kubeconfig" >> "$GITHUB_ENV"
          echo "CI_REGISTRY_CA_FILE=$RUNNER_TEMP/release/ca.crt" >> "$GITHUB_ENV"
      - name: Assemble digest-pinned image overrides
        run: |
          set -euo pipefail
          if [[ "${{ needs.plan.outputs.has_build_changes }}" == true ]]; then
            jq -s 'map(select(.service and .digest)) | map({key:.kustomize_name,value:{newName:(.image | sub(":[^:/@]+$"; "")),digest:.digest}}) | from_entries' .candidates/*.json > overrides.json
          else
            printf '{}\n' > overrides.json
          fi
          jq -e 'type == "object"' overrides.json >/dev/null
          echo "CI_GITOPS_IMAGE_OVERRIDES_JSON=$(jq -c . overrides.json)" >> "$GITHUB_ENV"
      - name: Promote GitOps snapshot with compare-and-swap retry
        id: gitops
        env:
          GITOPS_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          result=""
          for attempt in 1 2 3; do
            if result="$(ci-templates promote-snapshot --config "$CI_PROJECT_CONFIG" --source-sha "$GITHUB_SHA")"; then break; fi
            [[ "$attempt" == 3 ]] && exit 1
            sleep "$((attempt * 2))"
          done
          jq -e '.gitops_revision | strings | length == 40' <<<"$result" >/dev/null
          echo "$result"
          echo "gitops_revision=$(jq -r '.gitops_revision' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "gitops_base_revision=$(jq -r '.gitops_base_revision' <<<"$result")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/deploy
          ref: ${{ steps.gitops.outputs.gitops_revision }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          path: .gitops
      - name: Validate and apply GitOps application set
        run: |
          set -euo pipefail
          kubectl kustomize .gitops/Knowledge-Core/argocd >/dev/null
          kubectl apply -k .gitops/Knowledge-Core/argocd
      - name: Mark dev deployment pending
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ci-templates status --config "$CI_PROJECT_CONFIG" --sha "$GITHUB_SHA" --state pending --description "Knowledge Core dev deployment started" --target-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Wait for Argo CD
        run: ci-templates argo-wait --config "$CI_PROJECT_CONFIG" --revision "${{ steps.gitops.outputs.gitops_revision }}" --services "${{ needs.plan.outputs.release_services }}"
      - name: Run configured post-deploy smoke
        id: smoke
        run: |
          set -euo pipefail
          ci-templates smoke --config "$CI_PROJECT_CONFIG"
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "SMOKE_OK=true" >> "$GITHUB_ENV"
      - name: Mark dev smoke successful
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ci-templates status --config "$CI_PROJECT_CONFIG" --sha "$GITHUB_SHA" --state success --description "Knowledge Core dev smoke passed" --target-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Promote candidate tags and create release
        id: promote
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          BUILD_SERVICES: ${{ needs.plan.outputs.build_services }}
        run: |
          set -euo pipefail
          candidate_tag="$(python3 - <<'PY'
          import os
          from ci_templates.config import load_config
          print(load_config(os.environ["CI_PROJECT_CONFIG"]).candidate_tag_template.format(sha=os.environ["GITHUB_SHA"]))
          PY
          )"
          IFS=',' read -r -a selected <<< "$BUILD_SERVICES"
          for service in "${selected[@]}"; do
            [[ -z "$service" ]] && continue
            ci-templates promote-candidate --config "$CI_PROJECT_CONFIG" --service "$service" --tag "$candidate_tag"
          done
          echo "ok=true" >> "$GITHUB_OUTPUT"
          release_json="$(ci-templates release --config "$CI_PROJECT_CONFIG" --services "${{ needs.plan.outputs.release_services }}" --changes-file changes.json --summary-file release.md)"
          printf '%s\n' "$release_json"
          RELEASE_JSON="$release_json" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          tag = ""
          for line in os.environ.get("RELEASE_JSON", "").splitlines():
              line = line.strip()
              if line.startswith("{") and line.endswith("}"):
                  try:
                      tag = json.loads(line).get("release") or tag
                  except json.JSONDecodeError:
                      pass
          print("release_tag=%s" % (tag or ""))
          PY
      - name: Roll back unverified GitOps snapshot
        if: failure() && steps.gitops.outputs.gitops_revision != '' && steps.gitops.outputs.gitops_revision != steps.gitops.outputs.gitops_base_revision && env.SMOKE_OK != 'true'
        env:
          GITOPS_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ci-templates rollback-snapshot --config "$CI_PROJECT_CONFIG" --revision "${{ steps.gitops.outputs.gitops_revision }}"
      - name: Mark dev deployment failed
        if: failure() && steps.gitops.outputs.gitops_revision != ''
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ci-templates status --config "$CI_PROJECT_CONFIG" --sha "$GITHUB_SHA" --state failure --description "Knowledge Core dev deployment failed" --target-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  cleanup-candidates:
    needs: [plan, deploy-release]
    if: always() && needs.plan.outputs.has_build_changes == 'true' && (needs.deploy-release.outputs.smoke_ok != 'true' || needs.deploy-release.outputs.candidates_promoted == 'true')
    runs-on: hls-standard
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Prepare Harbor credentials
        env:
          HARBOR_DOCKER_CONFIG_JSON: ${{ secrets.HARBOR_DOCKER_CONFIG_JSON }}
          HARBOR_CA_PEM: ${{ secrets.HARBOR_CA_PEM }}
        run: |
          set -euo pipefail
          umask 077
          install -d "$RUNNER_TEMP/harbor"
          printf '%s' "$HARBOR_DOCKER_CONFIG_JSON" > "$RUNNER_TEMP/harbor/config.json"
          printf '%s' "$HARBOR_CA_PEM" > "$RUNNER_TEMP/harbor/ca.crt"
          test -s "$RUNNER_TEMP/harbor/config.json" && test -s "$RUNNER_TEMP/harbor/ca.crt"
          if [[ -s /etc/ssl/certs/ca-certificates.crt ]]; then
            cat /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/harbor/ca.crt" > "$RUNNER_TEMP/harbor/ca-bundle.crt"
          else
            cp "$RUNNER_TEMP/harbor/ca.crt" "$RUNNER_TEMP/harbor/ca-bundle.crt"
          fi
          echo "DOCKER_CONFIG=$RUNNER_TEMP/harbor" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=$RUNNER_TEMP/harbor/ca-bundle.crt" >> "$GITHUB_ENV"
      - name: Remove candidate tags after promotion or rollback
        env:
          BUILD_SERVICES: ${{ needs.plan.outputs.build_services }}
        run: |
          set -euo pipefail
          candidate_tag="$(python3 - <<'PY'
          import os
          from ci_templates.config import load_config
          print(load_config(os.environ["CI_PROJECT_CONFIG"]).candidate_tag_template.format(sha=os.environ["GITHUB_SHA"]))
          PY
          )"
          IFS=',' read -r -a selected <<< "$BUILD_SERVICES"
          for service in "${selected[@]}"; do
            [[ -z "$service" ]] && continue
            ci-templates cleanup-candidate --config "$CI_PROJECT_CONFIG" --service "$service" --tag "$candidate_tag" || echo "::warning::candidate cleanup failed for $service"
          done

  notify:
    if: always()
    needs: [plan, deploy-verify, go-verify-build, rust-verify-build, release-notes, prewarm-base-images, package-go-candidates, package-rust-candidates, deploy-release, cleanup-candidates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Mark Feishu pipeline task complete
        if: vars.FEISHU_TASK_TRACKER_ENABLED == 'true'
        continue-on-error: true
        uses: HappyLadySauceM/ci-templates/.github/actions/feishu-pipeline-task@0afa6fd5c6a58c2ad4529d02920afeefe2ec039e
        with:
          operation: sync
          phase: completed
          conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          app-id: ${{ vars.FEISHU_APP_ID }}
          app-secret: ${{ secrets.FEISHU_APP_SECRET }}
          chat-id: ${{ vars.FEISHU_CHAT_ID }}
          github-custom-attr-id: ${{ vars.FEISHU_GITHUB_ATTR_ID }}
          workflow-name: knowledge-core-pipeline
          github-token: ${{ github.token }}
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Notify Feishu CI
        if: vars.FEISHU_TASK_TRACKER_ENABLED != 'true'
        # Pin to the ci-templates commit that added CI-card notify.py.
        # 钉死到加入 CI 卡片的 ci-templates 提交。
        uses: HappyLadySauceM/ci-templates/.github/actions/feishu-notify@21d1752cc7f4fda3237cd7229be20ee3e608f1cf
        with:
          webhook: ${{ secrets.FEISHU_WEBHOOK_URL }}
          secret: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          card: ci
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
      - name: Notify Feishu release
        if: needs.deploy-release.result == 'success' && needs.deploy-release.outputs.release_tag != ''
        uses: HappyLadySauceM/ci-templates/.github/actions/feishu-notify@21d1752cc7f4fda3237cd7229be20ee3e608f1cf
        with:
          webhook: ${{ secrets.FEISHU_WEBHOOK_URL }}
          secret: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          card: release
          release-tag: ${{ needs.deploy-release.outputs.release_tag }}
