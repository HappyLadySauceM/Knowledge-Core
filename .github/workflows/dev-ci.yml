name: Dev CI

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: knowledge-core-dev-ci
  cancel-in-progress: true

jobs:
  verify-build-scan:
    name: verify, build and scan
    runs-on:
      group: Knowledge-Core CI
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      DOCKER_HOST: unix:///run/user/997/docker.sock
      GOPROXY: ${{ vars.GOPROXY }}
      HTTP_PROXY: ${{ vars.KC_CONTAINER_PROXY }}
      HTTPS_PROXY: ${{ vars.KC_CONTAINER_PROXY }}
      NO_PROXY: ${{ vars.KC_NO_PROXY }}
      IMAGE_REGISTRY: harbor.happyladysauce.local
      IMAGE_NAMESPACE: knowledge-core
    steps:
      - name: Check out dev commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Prepare ephemeral Harbor credentials
        shell: bash
        env:
          HARBOR_DOCKER_CONFIG_JSON: ${{ secrets.HARBOR_DOCKER_CONFIG_JSON }}
          HARBOR_CA_PEM: ${{ secrets.HARBOR_CA_PEM }}
        run: |
          set -euo pipefail
          umask 077
          install -d "$RUNNER_TEMP/knowledge-core-harbor"
          printf '%s' "$HARBOR_DOCKER_CONFIG_JSON" >"$RUNNER_TEMP/knowledge-core-harbor/config.json"
          printf '%s' "$HARBOR_CA_PEM" >"$RUNNER_TEMP/knowledge-core-harbor/ca.crt"
          test -s "$RUNNER_TEMP/knowledge-core-harbor/config.json"
          test -s "$RUNNER_TEMP/knowledge-core-harbor/ca.crt"

      - name: Run containerized quality gates
        shell: bash
        env:
          KC_CI_CACHE_ROOT: ${{ runner.tool_cache }}/knowledge-core/container-cache
          KC_CI_KEEP_ARTIFACTS: "true"
          KC_CONTAINER_PROXY: ${{ vars.KC_CONTAINER_PROXY }}
          KC_CONTAINER_NO_PROXY: ${{ vars.KC_NO_PROXY }}
        run: bash .github/ci/run.sh

      - name: Build and push immutable images
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/knowledge-core-harbor
          SOURCE_ROOT: ${{ github.workspace }}
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_METADATA_ROOT: ${{ runner.temp }}/knowledge-core-image-metadata
          KC_IMAGE_BUILDER: docker-buildx
        run: bash scripts/ci/build-images.sh

      - name: Resolve pushed digests
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/knowledge-core-harbor
          HARBOR_CA_FILE: ${{ runner.temp }}/knowledge-core-harbor/ca.crt
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_METADATA_ROOT: ${{ runner.temp }}/knowledge-core-image-metadata
          OUTPUT_ROOT: ${{ runner.temp }}/knowledge-core-release
        run: bash scripts/ci/resolve-images.sh

      - name: Scan images by digest
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/knowledge-core-harbor
          TRIVY_CACHE_DIR: ${{ runner.tool_cache }}/knowledge-core/trivy
        run: |
          set -euo pipefail
          install -d "$TRIVY_CACHE_DIR"
          docker run --rm \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 512 \
            --read-only \
            --network bridge \
            --entrypoint /bin/sh \
            --env DOCKER_CONFIG=/secrets/harbor \
            --env TRIVY_CACHE_DIR=/cache/trivy \
            --env IMAGE_MAP_FILE=/release/images.env \
            --env TRIVY_IGNORE_FILE=/source/.trivyignore.yaml \
            --env SSL_CERT_DIR=/etc/ssl/certs:/etc/knowledge-core/harbor \
            --env "HTTP_PROXY=$HTTP_PROXY" \
            --env "HTTPS_PROXY=$HTTPS_PROXY" \
            --env "NO_PROXY=$NO_PROXY" \
            --volume "$GITHUB_WORKSPACE:/source:ro" \
            --volume "$GITHUB_WORKSPACE/scripts/ci:/control:ro" \
            --volume "$RUNNER_TEMP/knowledge-core-release:/release:ro" \
            --volume "$DOCKER_CONFIG:/secrets/harbor:ro" \
            --volume "$RUNNER_TEMP/knowledge-core-harbor/ca.crt:/etc/knowledge-core/harbor/ca.crt:ro" \
            --volume "$TRIVY_CACHE_DIR:/cache/trivy:rw" \
            --tmpfs /tmp:rw,nosuid,nodev,size=536870912 \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            /control/scan-images.sh

      - name: Summarize immutable images
        shell: bash
        run: |
          {
            echo '### Dev CI images'
            echo
            sed 's/^/- `/' "$RUNNER_TEMP/knowledge-core-release/images.env" | sed 's/$/`/'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral credentials and workspace artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- \
            "$RUNNER_TEMP/knowledge-core-harbor" \
            "$RUNNER_TEMP/knowledge-core-image-metadata" \
            "$RUNNER_TEMP/knowledge-core-release"
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            cd "$GITHUB_WORKSPACE"
            workspace="$(pwd -P)"
            repository_root="$(cd "$(git rev-parse --show-toplevel)" && pwd -P)"
            if [[ "$workspace" != "$repository_root" ]]; then
              echo 'Refusing to clean outside GITHUB_WORKSPACE.' >&2
              exit 1
            fi
            git reset --hard HEAD
            git clean -ffdx
          fi
