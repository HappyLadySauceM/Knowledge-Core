version: "2"

run:
  # 1-CPU ARC runners need more than the default 5m even after GOMAXPROCS is capped.
  # 限制 GOMAXPROCS 之后，1 CPU 的 ARC runner 仍可能超过默认 5 分钟。
  timeout: 15m
  tests: true

linters:
  default: standard

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - services/collaboration

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
