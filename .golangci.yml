version: "2"

run:
  # Keep a 15m budget after GOMAXPROCS follows the 8-CPU ARC cgroup.
  # GOMAXPROCS 跟随 8 CPU ARC cgroup 后仍保留 15 分钟预算。
  timeout: 15m
  tests: true

linters:
  default: standard

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - services/collaboration

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
